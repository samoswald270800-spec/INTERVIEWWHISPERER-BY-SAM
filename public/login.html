<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sign in</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { margin:0; height:100vh; display:grid; place-items:center; background:#0b0b0b; color:#eaeaea; font-family:system-ui,Segoe UI,Roboto,Arial; }
    .card { width: 320px; padding:24px; border-radius:14px; background:#151515; box-shadow:0 10px 30px rgba(0,0,0,.4); }
    h1 { font-size:18px; margin:0 0 14px; }
    label { font-size:12px; opacity:.8 }
    input { width:100%; padding:10px 12px; border-radius:10px; border:1px solid #333; background:#0f0f0f; color:#fff; margin:6px 0 12px; }
    button { width:100%; padding:10px 14px; border:0; border-radius:10px; background:#4c8bf5; color:#fff; font-weight:600; cursor:pointer }
    .err { color:#ff6b6b; font-size:12px; min-height:16px; margin-bottom:6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <div class="err" id="err"></div>
    <label>Username</label>
    <input id="u" autocomplete="username" />
    <label>Password</label>
    <input id="p" type="password" autocomplete="current-password" />
    <button id="login">Log in</button>
  </div>
<script>
document.getElementById('login').onclick = async () => {
  const body = { username: document.getElementById('u').value.trim(), password: document.getElementById('p').value };
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify(body), credentials:'include' });
  if (r.ok) location.href = '/';
  else {
    const j = await r.json().catch(()=>({error:'Login failed'}));
    document.getElementById('err').textContent = j.error || 'Invalid username or password';
  }
};
</script>
</body>
</html>
