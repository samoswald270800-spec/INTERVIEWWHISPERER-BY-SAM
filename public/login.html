<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    @import url("https://fonts.googleapis.com/css?family=Poppins:300,400,500&display=swap");

    :root {
      --gold: #f6c56b;
      --blue: #4cd8ff;
    }

    * {
      font-family: "Poppins", sans-serif;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #0b0b0b, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ====== CONTAINER (animated border) ====== */
    .box {
      --a: 0deg;
      width: 360px;
      height: 160px;
      position: relative;
      border-radius: 24px;
      transition: 0.5s ease;
      animation: rotating 4s linear infinite;
    }

    /* Animated border behind */
    .box::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: repeating-conic-gradient(
          from var(--a),
          var(--gold) 0%,
          var(--gold) 10%,
          transparent 10%,
          transparent 50%,
          var(--blue) 60%
      );
      animation: rotating 4s linear infinite;
      z-index: 0;
    }

    /* Inner login panel (solid, not transparent) */
    .box::after {
      content: "";
      position: absolute;
      inset: 6px;
      background: #0d0d0d;   /* OPAQUE FIX ✅ */
      border-radius: 20px;
      z-index: 1;
    }

    @keyframes rotating {
      0% {
        --a: 0deg;
      }
      100% {
        --a: 360deg;
      }
    }

    /* ====== HOVER EXPANDS PANEL ====== */
    .box:hover {
      width: 450px;
      height: 480px;
    }

    /* ====== LOGIN CONTENT ====== */
    .login {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-direction: column;
      padding: 60px;
      opacity: 0;
      transform: translateY(50px);
      transition: 0.6s ease;
    }

    .box:hover .login {
      opacity: 1;
      transform: translateY(0);
    }

    /* Title */
    h2 {
      width: 100%;
      text-align: center;
      color: var(--gold);
      font-size: 24px;
      letter-spacing: 6px;
      font-weight: 500;
      margin-bottom: 32px;
      text-shadow: 0 0 18px rgba(246, 197, 107, 0.7);
    }

    /* Inputs */
    input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 30px;
      background: #1b1b1b;
      border: 1px solid #333;
      color: #e6e6e6;
      margin-bottom: 18px;
      font-size: 14px;
    }

    input::placeholder {
      color: #888;
    }

    /* Button */
    button {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      background: var(--gold);
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: 0.3s ease;
    }

    button:hover {
      background: #ffd282;
      box-shadow: 0 0 12px var(--gold);
    }

    .err {
      color: #ff6b6b;
      font-size: 12px;
      min-height: 16px;
      margin-bottom: 6px;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="login">
      <h2>LOGIN</h2>

      <div class="err" id="err"></div>

      <input id="u" autocomplete="username" placeholder="Username" />
      <input id="p" type="password" autocomplete="current-password" placeholder="Password" />

      <button id="login">Sign in</button>
    </div>
  </div>

  <script>
    document.getElementById("login").onclick = async () => {
      const body = {
        username: document.getElementById("u").value.trim(),
        password: document.getElementById("p").value,
      };

      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        credentials: "include",
      });

      if (r.ok) location.href = "/";
      else {
        const j = await r.json().catch(() => ({ error: "Login failed" }));
        document.getElementById("err").textContent =
          j.error || "Invalid username or password";
      }
    };
  </script>

</body>

</html>
