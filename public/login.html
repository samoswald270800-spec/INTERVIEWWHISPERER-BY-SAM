<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign in</title>

  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css">
  <style>
    @import url("https://fonts.googleapis.com/css?family=Poppins:300,400,600,700&display=swap");

    * { font-family: "Poppins", sans-serif; }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0b0b0b;
    }

    /* MAIN LOGIN BOX */
    .box {
      position: relative;
      width: 380px;
      height: 160px;
      border-radius: 22px;
      background: repeating-conic-gradient(
        from var(--a),
        #ffae00 0%,
        #ffae00 6%,
        transparent 6%,
        transparent 40%,
        #ffae00 50%
      );
      filter: drop-shadow(0 0 30px #000);
      transition: 0.4s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    /* ONLY SHOW BORDER SPIN WHEN CLASS IS ADDED */
    @property --a {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    /* SPIN WHEN loginBtn clicked */
    .spinFast {
      animation: rotateFast 1s linear infinite;
    }

    @keyframes rotateFast {
      0% { --a: 0deg; }
      100% { --a: 360deg; }
    }

    .box::after {
      content: "";
      position: absolute;
      inset: 5px;
      background: #111;
      border-radius: 18px;
      z-index: 1;
    }

    /* LOGIN FORM */
    .login {
      position: absolute; inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 14px;
      z-index: 2;
      color: white;
    }

    input {
      width: 70%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #1c1c1c;
      color: white;
      outline: none;
    }

    #loginBtn {
      width: 72%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      color: black;
      font-weight: bold;
      background: #ffae00;
      cursor: pointer;
      transition: transform .2s;
      z-index: 3;
    }

    #loginBtn:hover {
      transform: scale(1.05);
    }

    #err {
      margin-top: 6px;
      color: #ff6b6b;
      font-size: 12px;
      height: 12px;
    }
  </style>
</head>

<body>

  <div class="box" id="box">
    <div class="login">
      <h2>Login</h2>
      <div id="err"></div>
      <input id="u" placeholder="Username">
      <input id="p" type="password" placeholder="Password">
      <button id="loginBtn">Sign In</button>
    </div>
  </div>


  <script>
    const box = document.getElementById("box");
    const btn = document.getElementById("loginBtn");

    btn.onclick = async () => {
      const username = document.getElementById("u").value.trim();
      const password = document.getElementById("p").value;

      if (!username || !password) {
        document.getElementById("err").textContent = "Enter username and password";
        return;
      }

      document.getElementById("err").textContent = "";

      // ✅ START SPINNING FAST WHEN SIGN IN CLICKED
      box.classList.add("spinFast");

      // ⏳ Wait 2 seconds THEN login
      setTimeout(async () => {
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
          credentials: "include"
        });

        if (r.ok) location.href = "/";
        else {
          box.classList.remove("spinFast");
          const j = await r.json().catch(()=>({error:"Login failed"}));
          document.getElementById("err").textContent = j.error || "Invalid username or password";
        }

      }, 2000); // <--- 2s delay before server call
    };
  </script>

</body>
</html>
