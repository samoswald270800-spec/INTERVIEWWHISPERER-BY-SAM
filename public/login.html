<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css" />
<style>
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap");

:root{
  --pink:#ff2770;
  --cyan:#45f3ff;
  --bg:#0b0b0b;
}

*{ box-sizing:border-box; font-family:Poppins, sans-serif; }

body{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:radial-gradient(circle at center, #3a0d17 0%, #050505 60%, #000000 100%);
  overflow:hidden;
}

/* 🟣 Outer neon animated border */
@property --a {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}

.box{
  position:relative;
  width:420px;
  height:480px;
  border-radius:25px;
  background: repeating-conic-gradient(
    from var(--a),
    var(--pink) 0%, var(--pink) 8%,
    transparent 8%, transparent 43%,
    var(--cyan) 50%
  );
  filter:drop-shadow(0 0 25px var(--pink));
  animation:rotate 8s linear infinite;
  transition: all 0.6s ease;
}
.box:hover{
  transform: scale(1.05);
  filter: drop-shadow(0 0 60px var(--cyan));
  animation-duration: 3s; /* faster spin */
}

@keyframes rotate {
  0% { --a:0deg; }
  100% { --a:360deg; }
}

/* ✨ Card (glass panel) */
.box::after{
  content:"";
  position:absolute;
  inset:6px;
  background:#141414;
  border-radius:20px;
  box-shadow: inset 0 0 20px #000;
}

/* 🔐 Login content */
.login{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.loginBx{
  display:flex;
  flex-direction:column;
  width:70%;
  gap:25px;
  z-index:10;
}

h2{
  font-weight:600;
  text-align:center;
  color:var(--pink);
  letter-spacing:0.15em;
  margin-bottom:15px;
  text-shadow:0 0 15px var(--pink), 0 0 40px var(--pink);
  transition: all 0.4s ease;
}
.box:hover h2{
  text-shadow:0 0 30px var(--cyan), 0 0 60px var(--pink);
}

/* 🔹 Inputs */
input{
  width:100%;
  padding:14px 22px;
  background:#111;
  border:2px solid #2a2a2a;
  border-radius:30px;
  color:#fff;
  font-size:1rem;
  transition:0.3s ease;
}
input::placeholder{ color:#777; }
input:focus{
  outline:none;
  border-color:var(--cyan);
  box-shadow:0 0 10px var(--cyan);
}

/* 🔥 Login button */
button{
  padding:14px;
  border:none;
  border-radius:30px;
  background:var(--cyan);
  color:#000;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s ease;
}
button:hover{
  transform:scale(1.08);
  box-shadow:0 0 20px var(--cyan), 0 0 60px var(--cyan);
}
</style>
</head>

<body>
  <div class="box">
    <div class="login">
      <div class="loginBx">
        <h2>LOGIN</h2>

        <input id="u" type="text" placeholder="Username" autocomplete="username">
        <input id="p" type="password" placeholder="Password" autocomplete="current-password">

        <button id="loginBtn">Sign in</button>
      </div>
    </div>
  </div>

<script>
document.getElementById('loginBtn').onclick = async () => {
  const body = {
    username: document.getElementById('u').value.trim(),
    password: document.getElementById('p').value
  };

  const r = await fetch('/api/login', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify(body),
    credentials:'include'
  });

  if (r.ok) location.href = "/";
  else alert("Invalid credentials");
};
</script>
</body>
</html>
