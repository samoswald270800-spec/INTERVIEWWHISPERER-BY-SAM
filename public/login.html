<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ---------- theme: PURPLE-TO-PINK ---------- */
    :root {
      --bg: #000;
      --panel: #0d0d0d;
      --text: #e9e9e9;
      --muted: #9ea8a3;
      --purple: #a855f7;
      --pink: #ec4899;
      --purple-light: #d8b4fe;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, "Poppins", Segoe UI, Roboto, Arial;
    }

    body {
      margin: 0;
      height: 100dvh;
      display: grid;
      place-items: center;
      background: radial-gradient(
        1000px 600px at 50% -10%,
        #2d1b4e 0%,
        #000 60%,
        #000 100%
      );
      color: var(--text);
      overflow: hidden;
    }

    /* ---------- shell ---------- */
    .box {
      position: relative;
      width: 320px;
      height: 100px;
      will-change: width, height;
      transition:
        width 0.55s cubic-bezier(.16,1,.3,1),
        height 0.65s cubic-bezier(.16,1,.3,1);
      border-radius: 24px;
      cursor: pointer;
      transform: translateZ(0);
      backface-visibility: hidden;
      background: transparent; /* no card fill */
      box-shadow: none;        /* no card shadow */
    }

    .box:hover,
    .box.expanded {
      width: 400px;
      height: 440px;
    }

    /* ✅ ORB CANVAS BACKGROUND - MUCH LARGER to show full orb */
    .orb-canvas {
      position: absolute;
      inset: -200px;
      z-index: 0;
      pointer-events: none;
      opacity: 0.9;
    }

    .orb-canvas canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* Transparent panel - only for layout */
    .panel {
      position: absolute;
      inset: 0;
      background: transparent; /* card invisible */
      border: none;
      border-radius: 24px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 22px;
      backface-visibility: hidden;
      transform: translateZ(0);
      will-change: backdrop-filter;
    }

    h2 {
      margin: 4px 0 2px;
      letter-spacing: 10px;
      font-weight: 600;
      font-size: 20px;
      background: linear-gradient(135deg, var(--purple) 0%, var(--pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 20px rgba(168, 85, 247, 0.65);
      z-index: 2;
    }

    #hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      transition: opacity 0.30s cubic-bezier(.2,.8,.2,1);
      z-index: 2;
    }

    .box:hover #hint,
    .box.expanded #hint {
      opacity: 0;
    }

    /* Glassmorphic inputs with animated glow */
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 28px;
      background: rgba(13, 13, 13, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e8e8e8;
      margin-bottom: 14px;
      font-size: 14px;
      outline: none;
      position: relative;
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: border-color .2s, box-shadow .25s, background-color .25s;
    }
    input:hover,
    input:focus {
      border-color: rgba(216, 180, 254, 0.6);
      background: rgba(27, 27, 27, 0.55);
      box-shadow:
        0 0 22px rgba(168, 85, 247, 0.25),
        0 0 44px rgba(236, 72, 153, 0.18),
        0 6px 22px rgba(0, 0, 0, 0.45),
        inset 0 0 0 9999px rgba(255, 255, 255, 0.02);
    }
    input::placeholder { color: #7b7b7b; }

    /* Button with glass + shimmer + glow */
    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(135deg, var(--purple) 0%, var(--pink) 100%);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px) saturate(140%);
      -webkit-backdrop-filter: blur(8px) saturate(140%);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform .15s, filter .15s, box-shadow .25s;
    }
    button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.25) 40%, transparent 60%);
      transform: translateX(-120%);
      animation: shimmer 2.2s infinite;
      pointer-events: none;
    }
    button:hover,
    button:focus-visible {
      filter: brightness(1.12);
      box-shadow:
        0 0 28px rgba(168, 85, 247, 0.45),
        0 0 54px rgba(236, 72, 153, 0.35),
        0 10px 28px rgba(0, 0, 0, 0.5);
    }
    button:active { transform: translateY(1px); }

    @keyframes shimmer {
      0%   { transform: translateX(-120%); }
      60%  { transform: translateX(120%); }
      100% { transform: translateX(120%); }
    }

    /* Smoother form fade/slide keeps current positions */
    .form {
      margin-top: 28px;
      width: 100%;
      max-width: 340px;
      opacity: 0;
      transform: translateY(24px);
      transition:
        opacity 0.50s cubic-bezier(.16,1,.3,1),
        transform 0.60s cubic-bezier(.16,1,.3,1);
      pointer-events: none;
      z-index: 2;
    }
    .box:hover .form,
    .box.expanded .form {
      opacity: 1;
      transform: none;
      pointer-events: auto;
      transition-delay: .08s, .08s;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin: 0 12px 5px;
    }

    .btn-wrapper {
      position: relative;
      width: 100%;
    }

    .btn-wrapper:is(:hover, :focus-within) .tooltip {
      opacity: 1;
      visibility: visible;
    }

    .err {
      color: #ff6b6b;
      font-size: 11px;
      min-height: 14px;
      margin: 4px 6px 8px;
    }

    @media (max-width: 420px) {
      .box {
        width: 92vw;
      }
      .box:hover {
        width: 92vw;
      }
      .tooltip {
        top: -50px;
      }
    }
  </style>
</head>
<body>
  <div class="box" id="box">
    <div class="orb-canvas" id="orbCanvas"></div>

    <div class="panel">
      <h2>LOGIN</h2>
      <div id="hint">Hover or tap to login</div>

      <div class="form" id="form">
        <div class="err" id="err"></div>

        <label for="u">Username</label>
        <div class="btn-wrapper">
          <input id="u" autocomplete="username" placeholder="Username" />
          <div class="tooltip" aria-hidden="true">
            <div class="tooltip-box">The name on your layoff letter</div>
            <div class="tooltip-arrow"></div>
          </div>
        </div>

        <label for="p">Password</label>
        <div class="btn-wrapper">
          <input
            id="p"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
          />
          <div class="tooltip" aria-hidden="true">
            <div class="tooltip-box">No, you can't use your ex's birthday</div>
            <div class="tooltip-arrow"></div>
          </div>
        </div>

        <div class="btn-wrapper">
          <button id="loginBtn" type="button">Sign in</button>
          <div class="tooltip" aria-hidden="true">
            <div class="tooltip-box">Start lying Professionally</div>
            <div class="tooltip-arrow"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { Renderer, Program, Mesh, Triangle, Vec3 } from 'https://cdn.skypack.dev/ogl';

    // Initialize Orb
    const container = document.getElementById('orbCanvas');
    const renderer = new Renderer({ alpha: true, premultipliedAlpha: false });
    const gl = renderer.gl;
    gl.clearColor(0, 0, 0, 0);
    container.appendChild(gl.canvas);

    const vert = `
      precision highp float;
      attribute vec2 position;
      attribute vec2 uv;
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const frag = `
      precision highp float;
      uniform float iTime;
      uniform vec3 iResolution;
      uniform float hue;
      uniform float hover;
      uniform float rot;
      uniform float hoverIntensity;
      varying vec2 vUv;

      vec3 rgb2yiq(vec3 c) {
        float y = dot(c, vec3(0.299, 0.587, 0.114));
        float i = dot(c, vec3(0.596, -0.274, -0.322));
        float q = dot(c, vec3(0.211, -0.523, 0.312));
        return vec3(y, i, q);
      }
      vec3 yiq2rgb(vec3 c) {
        float r = c.x + 0.956 * c.y + 0.621 * c.z;
        float g = c.x - 0.272 * c.y - 0.647 * c.z;
        float b = c.x - 1.106 * c.y + 1.703 * c.z;
        return vec3(r, g, b);
      }
      vec3 adjustHue(vec3 color, float hueDeg) {
        float hueRad = hueDeg * 3.14159265 / 180.0;
        vec3 yiq = rgb2yiq(color);
        float cosA = cos(hueRad);
        float sinA = sin(hueRad);
        float i = yiq.y * cosA - yiq.z * sinA;
        float q = yiq.y * sinA + yiq.z * cosA;
        yiq.y = i;
        yiq.z = q;
        return yiq2rgb(yiq);
      }
      vec3 hash33(vec3 p3) {
        p3 = fract(p3 * vec3(0.1031, 0.11369, 0.13787));
        p3 += dot(p3, p3.yxz + 19.19);
        return -1.0 + 2.0 * fract(vec3(p3.x + p3.y, p3.x + p3.z, p3.y + p3.z) * p3.zyx);
      }
      float snoise3(vec3 p) {
        const float K1 = 0.333333333;
        const float K2 = 0.166666667;
        vec3 i = floor(p + (p.x + p.y + p.z) * K1);
        vec3 d0 = p - (i - (i.x + i.y + i.z) * K2);
        vec3 e = step(vec3(0.0), d0 - d0.yzx);
        vec3 i1 = e * (1.0 - e.zxy);
        vec3 i2 = 1.0 - e.zxy * (1.0 - e);
        vec3 d1 = d0 - (i1 - K2);
        vec3 d2 = d0 - (i2 - K1);
        vec3 d3 = d0 - 0.5;
        vec4 h = max(0.6 - vec4(dot(d0, d0), dot(d1, d1), dot(d2, d2), dot(d3, d3)), 0.0);
        vec4 n = h * h * h * h * vec4(
          dot(d0, hash33(i)),
          dot(d1, hash33(i + i1)),
          dot(d2, hash33(i + i2)),
          dot(d3, hash33(i + 1.0))
        );
        return dot(vec4(31.316), n);
      }
      vec4 extractAlpha(vec3 colorIn) {
        float a = max(max(colorIn.r, colorIn.g), colorIn.b);
        return vec4(colorIn.rgb / (a + 1e-5), a);
      }
      const vec3 baseColor1 = vec3(0.611765, 0.262745, 0.996078);
      const vec3 baseColor2 = vec3(0.298039, 0.760784, 0.913725);
      const vec3 baseColor3 = vec3(0.062745, 0.078431, 0.600000);
      const float innerRadius = 0.6;
      const float noiseScale = 0.65;
      float light1(float intensity, float attenuation, float dist) {
        return intensity / (1.0 + dist * attenuation);
      }
      float light2(float intensity, float attenuation, float dist) {
        return intensity / (1.0 + dist * dist * attenuation);
      }
      vec4 draw(vec2 uv) {
        vec3 color1 = adjustHue(baseColor1, hue);
        vec3 color2 = adjustHue(baseColor2, hue);
        vec3 color3 = adjustHue(baseColor3, hue);
        float ang = atan(uv.y, uv.x);
        float len = length(uv);
        float invLen = len > 0.0 ? 1.0 / len : 0.0;
        float n0 = snoise3(vec3(uv * noiseScale, iTime * 0.5)) * 0.5 + 0.5;
        float r0 = mix(mix(innerRadius, 1.0, 0.4), mix(innerRadius, 1.0, 0.6), n0);
        float d0 = distance(uv, (r0 * invLen) * uv);
        float v0 = light1(1.0, 10.0, d0);
        v0 *= smoothstep(r0 * 1.05, r0, len);
        float cl = cos(ang + iTime * 2.0) * 0.5 + 0.5;
        
        float a = iTime * -1.0;
        vec2 pos = vec2(cos(a), sin(a)) * r0;
        float d = distance(uv, pos);
        float v1 = light2(1.5, 5.0, d);
        v1 *= light1(1.0, 50.0, d0);
        
        float v2 = smoothstep(1.0, mix(innerRadius, 1.0, n0 * 0.5), len);
        float v3 = smoothstep(innerRadius, mix(innerRadius, 1.0, 0.5), len);
        
        vec3 col = mix(color1, color2, cl);
        col = mix(color3, col, v0);
        col = (col + v1) * v2 * v3;
        col = clamp(col, 0.0, 1.0);
        
        return extractAlpha(col);
      }

      vec4 mainImage(vec2 fragCoord) {
        vec2 center = iResolution.xy * 0.5;
        float size = min(iResolution.x, iResolution.y);
        vec2 uv = (fragCoord - center) / size * 2.0;
        
        float angle = rot;
        float s = sin(angle);
        float c = cos(angle);
        uv = vec2(c * uv.x - s * uv.y, s * uv.x + c * uv.y);
        
        uv.x += hover * hoverIntensity * 0.1 * sin(uv.y * 10.0 + iTime);
        uv.y += hover * hoverIntensity * 0.1 * sin(uv.x * 10.0 + iTime);
        
        return draw(uv);
      }

      void main() {
        vec2 fragCoord = vUv * iResolution.xy;
        vec4 col = mainImage(fragCoord);
        /* Straight alpha (renderer premultipliedAlpha: false) */
        gl_FragColor = vec4(col.rgb, col.a);
      }
    `;

    const geometry = new Triangle(gl);
    const program = new Program(gl, {
      vertex: vert,
      fragment: frag,
      uniforms: {
        iTime: { value: 0 },
        iResolution: { value: new Vec3(gl.canvas.width, gl.canvas.height, gl.canvas.width / gl.canvas.height) },
        hue: { value: 280 },
        hover: { value: 0 },
        rot: { value: 0 },
        hoverIntensity: { value: 0.5 }
      }
    });

    const mesh = new Mesh(gl, { geometry, program });

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const width = container.clientWidth;
      const height = container.clientHeight;
      renderer.setSize(width * dpr, height * dpr);
      gl.canvas.style.width = width + 'px';
      gl.canvas.style.height = height + 'px';
      program.uniforms.iResolution.value.set(gl.canvas.width, gl.canvas.height, gl.canvas.width / gl.canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    let targetHover = 0;
    let lastTime = 0;
    let currentRot = 0;
    const rotationSpeed = 0.3;

    const box = document.getElementById('box');
    box.addEventListener('mouseenter', () => { targetHover = 1; });
    box.addEventListener('mouseleave', () => { targetHover = 0; });

    let rafId;
    const update = t => {
      rafId = requestAnimationFrame(update);
      const dt = (t - lastTime) * 0.001;
      lastTime = t;
      program.uniforms.iTime.value = t * 0.001;
      program.uniforms.hover.value += (targetHover - program.uniforms.hover.value) * 0.1;
      
      if (targetHover > 0.5) {
        currentRot += dt * rotationSpeed;
      }
      program.uniforms.rot.value = currentRot;
      
      renderer.render({ scene: mesh });
    };
    rafId = requestAnimationFrame(update);

    // Tap-to-toggle for touch devices
    let expanded = false;
    const isCoarse = window.matchMedia('(hover: none), (pointer: coarse)').matches;
    if (isCoarse) {
      box.addEventListener('click', (e) => {
        // prevent toggling when clicking interactive children if needed
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'button' || tag === 'label') return;
        expanded = !expanded;
        box.classList.toggle('expanded', expanded);
        targetHover = expanded ? 1 : 0;
      }, { passive: true });
    }
    // On desktop, hover controls size exclusively; mouseleave always shrinks.

    // Login handler
    document.getElementById('loginBtn').onclick = async () => {
      const body = {
        username: document.getElementById('u').value.trim(),
        password: document.getElementById('p').value,
      };

      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        credentials: 'include',
      });

      if (r.ok) location.href = '/';
      else {
        const j = await r.json().catch(() => ({ error: 'Login failed' }));
        document.getElementById('err').textContent = j.error || 'Invalid username or password';
      }
    };
  </script>
</body>
</html>
