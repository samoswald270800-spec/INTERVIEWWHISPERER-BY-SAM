<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ---------- theme ---------- */
 :root{
  --bg:#000;
  --panel:#0d0d0d;
  --text:#e9e9e9;
  --muted:#9ea8a3;

  /* ✅ GREEN THEME */
  --green:#52ff90;
  --green-soft:#adffce;
}

    *{box-sizing:border-box;font-family:system-ui,"Poppins",Segoe UI,Roboto,Arial}

    body{
      margin:0; height:100dvh; display:grid; place-items:center;
      background: radial-gradient(1000px 600px at 50% -10%, #14110a 0%, #000 60%, #000 100%);
      color:var(--text);
      overflow:hidden;
    }

    /* ---------- shell ---------- */
    .box{
      position:relative;
      width:360px; height:120px;          /* collapsed */
      transition: width .45s cubic-bezier(.2,.7,.2,1), height .45s cubic-bezier(.2,.7,.2,1);
      border-radius:24px;
      cursor:pointer;
    }
    /* expand on hover or when .expanded (tap) */
    .box:hover, .box.expanded{ width:460px; height:480px; }

    /* spinning glow ring behind the panel */
    .glow{
      position:absolute; inset:-8px;
      border-radius:28px;
     background: radial-gradient(circle, rgba(82,255,144,.55), rgba(82,255,144,.18), transparent 70%);
  box-shadow:
    0 0 30px rgba(82,255,144,.5),
    0 0 60px rgba(82,255,144,.35),
    inset 0 0 20px rgba(82,255,144,.4);
  z-index:0;
  pointer-events:none;
}

    /* solid panel (no transparency) */
    .panel{
      position:absolute; inset:0;
      background:var(--panel);
      border-radius:24px;
      box-shadow:
        inset 0 2px 12px rgba(255,255,255,.03),
        0 10px 40px rgba(0,0,0,.55);
      z-index:1;
      display:flex; flex-direction:column; align-items:center;
      padding:28px 26px;
    }

    /* header + hint (always visible in collapsed) */
    h2{
      margin:6px 0 2px;
      letter-spacing:10px;
      font-weight:600;
      color:var(--green);
text-shadow:0 0 20px rgba(82,255,144,.65);
      z-index:2;
    }
    #hint{
      font-size:12px; color:var(--muted);
      margin-top:2px; transition:opacity .35s;
      z-index:2;
    }
    /* hide hint when expanded */
    .box:hover #hint, .box.expanded #hint{ opacity:0 }

    /* form (hidden until expand) */
    .form{
      margin-top:34px;
      width:100%;
      max-width:360px;
      opacity:0; transform:translateY(24px);
      transition: opacity .45s, transform .45s;
      pointer-events:none;
      z-index:2;
    }
    .box:hover .form, .box.expanded .form{
      opacity:1; transform:none; pointer-events:auto;
    }

    label{display:block; font-size:12px; color:var(--muted); margin:0 12px 6px}
    input{
      width:100%; padding:14px 18px; border-radius:28px;
      background:#1b1b1b; border:1px solid #2f2f2f; color:#e8e8e8;
      margin-bottom:18px; font-size:15px; outline:none;
      transition:border-color .2s, box-shadow .2s;
    }
    input:focus{
      border-color:#5d5d5d;
      box-shadow:0 0 0 3px rgba(246,197,107,.18);
    }
    input::placeholder{color:#7b7b7b}

    button{
      width:100%; padding:14px 18px; border-radius:28px; border:0;
      background:var(--green); color:#0d0d0d; font-weight:700; font-size:16px;
      cursor:pointer; transition:transform .15s, background .15s, box-shadow .2s;
    }
    button:hover{
  background:var(--green-soft);
  box-shadow:0 0 14px var(--green); }
    button:active{ transform:translateY(1px) }

    .err{ color:#ff6b6b; font-size:12px; min-height:16px; margin:6px 6px 10px }

    /* small safety for very small phones */
    @media (max-width:420px){
      .box{ width: 92vw }
      .box:hover, .box.expanded{ width: 92vw }
    }
  </style>
</head>
<body>

  <div class="box" id="box">
    <div class="glow" aria-hidden="true"></div>

    <div class="panel">
      <h2>LOGIN</h2>
      <div id="hint">Hover or tap to login</div>

      <div class="form" id="form">
        <div class="err" id="err"></div>

        <label for="u">Username</label>
        <input id="u" autocomplete="username" placeholder="Username" />

        <label for="p">Password</label>
        <input id="p" type="password" autocomplete="current-password" placeholder="Password" />

        <button id="loginBtn" type="button">Sign in</button>
      </div>
    </div>
  </div>

  <script>
    // Tap-to-toggle for touch devices (so "hover" works on mobile)
    const box = document.getElementById('box');
    let expanded = false;
    box.addEventListener('click', (e) => {
      // If already expanded and click is on the button, let it submit
      if (!expanded) {
        expanded = true;
        box.classList.add('expanded');
      }
    }, { passive: true });

    // Login handler (unchanged backend)
    document.getElementById('loginBtn').onclick = async () => {
      const body = {
        username: document.getElementById('u').value.trim(),
        password: document.getElementById('p').value
      };

      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        credentials: 'include'
      });

      if (r.ok) location.href = '/';
      else {
        const j = await r.json().catch(() => ({ error: 'Login failed' }));
        document.getElementById('err').textContent = j.error || 'Invalid username or password';
      }
    };
  </script>

</body>
</html>
