<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    @import url("https://fonts.googleapis.com/css?family=Poppins:300,400,500&display=swap");

    :root {
      --gold: #f6c56b;
      --blue: #4cd8ff;
    }

    * {
      font-family: "Poppins", sans-serif;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #0b0b0b, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Rotating border container */
    .box {
      --a: 0deg;
      width: 360px;
      height: 120px;
      position: relative;
      border-radius: 24px;
      cursor: pointer;
      transition: 0.5s ease;
      animation: spin 4s linear infinite;   /* ✅ spinning restored */
    }

    /* glowing neon rotating gradient */
    .box::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: repeating-conic-gradient(
          from var(--a),
          var(--gold) 0%,
          var(--gold) 12%,
          transparent 12%,
          transparent 50%,
          var(--blue) 60%
      );
      animation: spin 4s linear infinite;
      z-index: 0;
    }

    /* opaque login panel inside */
    .box::after {
      content: "";
      position: absolute;
      inset: 6px;
      background: #0d0d0d; /* ✅ panel solid */
      border-radius: 20px;
      z-index: 1;
    }

    /* SPIN effect */
    @keyframes spin {
      0% { --a: 0deg; }
      100% { --a: 360deg; }
    }

    /* EXPAND ON HOVER */
    .box:hover {
      width: 450px;
      height: 480px;
    }

    /* LOGIN CONTENT */
    .login {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      opacity: 0;
      transform: translateY(60px);
      transition: opacity .6s, transform .6s;
      padding: 70px;
    }

    /* SHOW WHEN EXPANDED */
    .box:hover .login {
      opacity: 1;
      transform: translateY(0);
    }

    /* LOGIN title */
    h2 {
      text-align: center;
      color: var(--gold);
      font-size: 26px;
      letter-spacing: 7px;
      font-weight: 500;
      text-shadow: 0 0 18px rgba(246, 197, 107, 0.7);
      margin-bottom: 26px;
      z-index: 11;
    }

    /* small toast hint */
    #hint {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
      opacity: 1;
      transition: 0.4s;
      z-index: 11;
      text-align: center;
    }

    /* hide hint when expanded */
    .box:hover #hint {
      opacity: 0;
    }

    /* input styles */
    input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 30px;
      background: #1b1b1b;
      border: 1px solid #333;
      color: #e6e6e6;
      margin-bottom: 18px;
      font-size: 15px;
    }
    input::placeholder { color: #777; }

    /* button */
    button {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      background: var(--gold);
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
    }

    button:hover {
      background: #ffd991;
      box-shadow: 0 0 12px var(--gold);
    }

    .err {
      color: #ff6b6b;
      font-size: 12px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>LOGIN</h2>
    <div id="hint">Hover or tap to login</div> <!-- ✅ Toast restored -->

    <div class="login">
      <div class="err" id="err"></div>
      <input id="u" placeholder="Username" autocomplete="username" />
      <input id="p" type="password" autocomplete="current-password"
             placeholder="Password" />
      <button id="loginBtn">Sign in</button>
    </div>
  </div>

  <script>
    document.getElementById("loginBtn").onclick = async () => {
      const body = {
        username: document.getElementById("u").value.trim(),
        password: document.getElementById("p").value
      };

      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        credentials: "include"
      });

      if (r.ok) location.href = "/";
      else {
        const j = await r.json().catch(() => ({ error: "Login failed" }));
        document.getElementById("err").textContent =
          j.error || "Invalid username or password";
      }
    };
  </script>

</body>

</html>
