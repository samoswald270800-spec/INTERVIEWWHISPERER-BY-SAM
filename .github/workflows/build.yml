name: Build Desktop App

on:
  push:
    branches: [main-2.0]
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  # ─────────────────────────────────────────────
  # Windows Build → portable .exe
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Build React frontend
        run: |
          cd public
          npm install
          npm run build

      - name: Build Electron app (Windows)
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist-electron/Interview-Whisperer-Setup.exe
          retention-days: 30

  # ─────────────────────────────────────────────
  # macOS Build → .dmg installer (ad-hoc signed)
  # Ad-hoc signing (-) satisfies Gatekeeper on
  # macOS 13+ without a paid Apple Developer cert.
  # ─────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Build React frontend
        run: |
          cd public
          npm install
          npm run build

      - name: Build Electron app (macOS)
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Ad-hoc sign every .app bundle so Gatekeeper allows launch
      # without a paid Apple Developer certificate.
      # codesign -s "-" means "local/self signature" — free, no account needed.
      - name: Ad-hoc sign .app bundles
        run: |
          for app in dist-electron/**/*.app; do
            echo "Ad-hoc signing: $app"
            codesign --deep --force --sign "-" "$app" || true
          done

      # Remove macOS quarantine flag from the signed .app inside the DMG.
      # This is the root cause of the "move to trash" prompt on Gatekeeper.
      - name: Strip quarantine from built DMGs
        run: |
          for dmg in dist-electron/*.dmg; do
            echo "Stripping quarantine from: $dmg"
            xattr -cr "$dmg" || true
          done

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: dist-electron/*.dmg
          retention-days: 30

  # ─────────────────────────────────────────────
  # Release: attach both builds to a GitHub Release
  # ─────────────────────────────────────────────
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./release

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Interview Whisperer — Build ${{ github.run_number }}"
          body: |
            ## Downloads
            - **Windows**: `Interview-Whisperer-Setup.exe` — portable, no installation needed
            - **macOS Intel** (older Macs): `Interview-Whisperer-*-x64.dmg`
            - **macOS Apple Silicon** (M1/M2/M3): `Interview-Whisperer-*-arm64.dmg`

            ### macOS Install Instructions
            1. Download the `.dmg` for your chip
            2. Open it and drag **Interview Whisperer** to **Applications**
            3. Open the app normally — no special steps needed

            > If macOS still blocks it, open **Terminal** and run:
            > ```
            > xattr -cr "/Applications/Interview Whisperer.app"
            > ```
            > Then double-click the app as normal.
          files: ./release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
