name: Build Desktop App

# Build installers when code is merged to main-2.0, or on demand via the
# "Run workflow" button. Installers publish straight to Releases (no Actions
# storage used), so builds are safe to run on merge.
on:
  workflow_dispatch:
  push:
    branches: [main-2.0]

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Windows → installer .exe, uploaded straight to
  # the GitHub Release. We do NOT use upload-artifact:
  # Release assets don't count against the 500 MB
  # Actions storage quota, artifacts do.
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Build React frontend
        run: |
          cd public
          npm install
          npm run build

      - name: Configure Windows virtual camera components
        run: cmake -S native/windows-virtual-camera -B "$env:RUNNER_TEMP/whisper-vcam-build" -A x64

      - name: Build Windows virtual camera components
        run: cmake --build "$env:RUNNER_TEMP/whisper-vcam-build" --config Release

      - name: Test Windows virtual camera source
        run: ctest --test-dir "$env:RUNNER_TEMP/whisper-vcam-build" -C Release --output-on-failure

      - name: Bundle Windows virtual camera components
        shell: powershell
        run: |
          Copy-Item "$env:RUNNER_TEMP/whisper-vcam-build/Release/WhisperVirtualCameraBridge.exe" native/windows-virtual-camera/WhisperVirtualCameraBridge.exe
          Copy-Item "$env:RUNNER_TEMP/whisper-vcam-build/Release/WhisperVirtualCameraManager.exe" native/windows-virtual-camera/WhisperVirtualCameraManager.exe
          Copy-Item "$env:RUNNER_TEMP/whisper-vcam-build/Release/WhisperVirtualCameraSource.dll" native/windows-virtual-camera/WhisperVirtualCameraSource.dll

      - name: Build Electron app (Windows)
        run: npx electron-builder --win --x64 --publish never

      - name: Publish Windows installer to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Interview Whisperer — Build ${{ github.run_number }}"
          body: |
            ## Downloads
            - **Windows**: `Interview-Whisperer-Setup.exe`
            - **macOS Apple Silicon** (M1/M2/M3/M4): `Interview-Whisperer-*-arm64.dmg`

            ### Windows: if you see "Windows protected your PC"
            Click **More info** → **Run anyway**.

            ### macOS: if it won't open
            Right-click the app → **Open** → **Open**. If still blocked, run in Terminal:
            `xattr -cr "/Applications/Interview Whisperer.app"`

            ### macOS permissions (first remote session)
            Allow **Screen Recording** and **Accessibility** in
            System Settings → Privacy & Security, then reopen the app.
          files: dist-electron/Interview-Whisperer-Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # macOS Apple Silicon (arm64) → .dmg, appended to
  # the SAME Release. Runs after Windows so both jobs
  # write the same release tag without racing.
  # (Built on macos-latest so the native input engine
  # matches the CPU. Covers Macs from ~2020 onward.)
  # ─────────────────────────────────────────────
  build-mac:
    needs: build-windows
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Build React frontend
        run: |
          cd public
          npm install
          npm run build

      - name: Build Electron app (macOS arm64)
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Ad-hoc sign so Gatekeeper allows launch without a paid Apple cert.
      - name: Ad-hoc sign .app bundles
        run: |
          for app in dist-electron/**/*.app; do
            echo "Ad-hoc signing: $app"
            codesign --deep --force --sign "-" "$app" || true
          done

      - name: Strip quarantine from built DMGs
        run: |
          for dmg in dist-electron/*.dmg; do
            echo "Stripping quarantine from: $dmg"
            xattr -cr "$dmg" || true
          done

      - name: Publish macOS installer to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Interview Whisperer — Build ${{ github.run_number }}"
          files: dist-electron/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
