<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Dashboard</title>
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-card: #12121a;
      --border: rgba(255,255,255,0.08);
      --text-white: #fff;
      --text-muted: #888;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 24px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); color: var(--text-white); }
    .btn-danger { background: var(--danger); color: white; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .stat-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .stat-card .value { font-size: 32px; font-weight: 700; }
    .stat-card.purple .value { color: var(--accent); }
    .stat-card.green .value { color: var(--success); }
    .stat-card.yellow .value { color: var(--warning); }
    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .panel-header h2 { font-size: 16px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 20px; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-size: 11px; text-transform: uppercase; color: var(--text-muted); }
    td { font-size: 14px; }
    tr:hover { background: rgba(255,255,255,0.02); }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 500; }
    .badge-active { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .badge-paused { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.2s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%; max-width: 480px;
    }
    .modal h3 { font-size: 18px; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 12px 14px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-white);
      font-size: 14px;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 14px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 1001;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ Super Admin Dashboard</h1>
      <div style="display:flex;gap:12px;">
        <button class="btn btn-secondary" onclick="refreshData()">Refresh</button>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
      </div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card purple"><div class="label">Total Admins</div><div class="value" id="statAdmins">-</div></div>
      <div class="stat-card green"><div class="label">Total Users</div><div class="value" id="statUsers">-</div></div>
      <div class="stat-card yellow"><div class="label">Sessions Today</div><div class="value" id="statSessions">-</div></div>
      <div class="stat-card"><div class="label">Total Credits</div><div class="value" id="statCredits">-</div></div>
    </div>
    
    <div class="panel">
      <div class="panel-header">
        <h2>Manage Admins</h2>
        <button class="btn btn-primary" onclick="showModal('createAdminModal')">+ Add Admin</button>
      </div>
      <table>
        <thead><tr><th>Name</th><th>Username</th><th>Credits</th><th>Users</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="adminsTable"><tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-muted);">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
  
  <div class="modal-overlay" id="createAdminModal">
    <div class="modal">
      <h3>Create New Admin</h3>
      <form id="createAdminForm">
        <div class="form-group"><label>Company Name</label><input type="text" name="name" required placeholder="Acme Consulting"></div>
        <div class="form-group"><label>Username</label><input type="text" name="username" required placeholder="acme_admin"></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="6" placeholder="••••••••"></div>
        <div class="form-group"><label>Initial Credits</label><input type="number" name="credits" value="100" min="0"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('createAdminModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>
  
  <div class="modal-overlay" id="creditsModal">
    <div class="modal">
      <h3>Manage Credits</h3>
      <form id="creditsForm">
        <input type="hidden" name="adminId" id="creditsAdminId">
        <div class="form-group"><label>Admin: <span id="creditsAdminName"></span></label></div>
        <div class="form-group"><label>Amount (+add / -deduct)</label><input type="number" name="amount" required placeholder="100"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('creditsModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Update</button>
        </div>
      </form>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>

  <script>
    async function api(endpoint, options = {}) {
      const res = await fetch(`/api/super-admin${endpoint}`, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...options.headers }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'API Error');
      return data;
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function showModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    
    function showCreditsModal(adminId, adminName) {
      document.getElementById('creditsAdminId').value = adminId;
      document.getElementById('creditsAdminName').textContent = adminName;
      showModal('creditsModal');
    }

    async function loadStats() {
      try {
        const { stats } = await api('/stats');
        document.getElementById('statAdmins').textContent = stats.totalAdmins;
        document.getElementById('statUsers').textContent = stats.totalUsers;
        document.getElementById('statSessions').textContent = stats.sessionsToday;
        document.getElementById('statCredits').textContent = stats.totalAdminCredits.toLocaleString();
      } catch (e) { console.error(e); }
    }

    async function loadAdmins() {
      try {
        const { admins } = await api('/admins');
        const tbody = document.getElementById('adminsTable');
        if (!admins.length) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-muted);">No admins yet</td></tr>';
          return;
        }
        tbody.innerHTML = admins.map(a => `
          <tr>
            <td><strong>${a.name}</strong></td>
            <td>${a.username}</td>
            <td>${a.credits.toLocaleString()}</td>
            <td>${a.userCount}</td>
            <td><span class="badge badge-${a.status || 'active'}">${a.status || 'active'}</span></td>
            <td>
              <button class="btn btn-secondary" style="padding:6px 12px;font-size:12px;" onclick="showCreditsModal('${a.id}', '${a.name}')">Credits</button>
              <button class="btn btn-danger" style="padding:6px 12px;font-size:12px;" onclick="deleteAdmin('${a.id}', '${a.name}')">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        console.error(e);
        document.getElementById('adminsTable').innerHTML = '<tr><td colspan="6" style="color:var(--danger);">Failed to load</td></tr>';
      }
    }

    document.getElementById('createAdminForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      try {
        await api('/admins', {
          method: 'POST',
          body: JSON.stringify({
            name: form.name.value,
            username: form.username.value,
            password: form.password.value,
            credits: parseInt(form.credits.value) || 0
          })
        });
        closeModal('createAdminModal');
        form.reset();
        showToast('Admin created!');
        loadStats();
        loadAdmins();
      } catch (e) { showToast(e.message, 'error'); }
    });

    document.getElementById('creditsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      try {
        await api(`/admins/${form.adminId.value}/credits`, {
          method: 'POST',
          body: JSON.stringify({ amount: parseInt(form.amount.value) })
        });
        closeModal('creditsModal');
        showToast('Credits updated!');
        loadStats();
        loadAdmins();
      } catch (e) { showToast(e.message, 'error'); }
    });

    async function deleteAdmin(id, name) {
      if (!confirm(`Delete "${name}" and all their users?`)) return;
      try {
        await api(`/admins/${id}`, { method: 'DELETE' });
        showToast('Admin deleted');
        loadStats();
        loadAdmins();
      } catch (e) { showToast(e.message, 'error'); }
    }

    function refreshData() { loadStats(); loadAdmins(); showToast('Refreshed'); }
    async function logout() { await fetch('/api/logout', { method: 'POST' }); window.location.href = '/login'; }

    loadStats();
    loadAdmins();
  </script>
</body>
</html>
