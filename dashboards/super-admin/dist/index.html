<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Manrope',sans-serif;background:#030306;color:#f8fafc;min-height:100vh}
    body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(139,92,246,.2),transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(6,182,212,.15),transparent 50%);pointer-events:none}
    .wrap{max-width:1320px;margin:0 auto;padding:40px 24px;position:relative}
    header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,.08)}
    h1{font-family:'Space Grotesk',sans-serif;font-size:28px;background:linear-gradient(135deg,#f59e0b,#f43f5e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .hdr-right{display:flex;gap:12px;flex-wrap:wrap}
    .btn{border:none;border-radius:14px;padding:12px 20px;font-weight:600;font-size:14px;cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;gap:8px}
    .btn-primary{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;box-shadow:0 10px 30px rgba(124,58,237,.3)}
    .btn-ghost{background:rgba(255,255,255,.05);color:#94a3b8;border:1px solid rgba(255,255,255,.1)}
    .btn:hover{transform:translateY(-2px)}
    .btn-sm{padding:8px 14px;font-size:12px;border-radius:10px}
    .btn-danger{background:rgba(244,63,94,.15);color:#f43f5e;border:1px solid rgba(244,63,94,.3)}
    .btn-danger:hover{background:rgba(244,63,94,.25)}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:28px}
    .stat{background:rgba(12,14,20,.7);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:22px;backdrop-filter:blur(12px)}
    .stat-label{color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
    .stat-value{font-family:'Space Grotesk',sans-serif;font-size:32px;margin-top:6px}
    .panel{background:rgba(12,14,20,.65);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:24px;backdrop-filter:blur(16px);margin-bottom:24px}
    .panel h2{font-family:'Space Grotesk',sans-serif;font-size:18px;margin-bottom:18px}
    .list{display:flex;flex-direction:column;gap:14px}
    .admin-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden;transition:border .2s}
    .admin-card:hover{border-color:rgba(255,255,255,.18)}
    .admin-header{padding:18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;cursor:pointer}
    .avatar{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#06b6d4,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700}
    .meta{color:#64748b;font-size:13px}
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
    .pill.active{background:rgba(16,185,129,.18);color:#34d399}
    .pill.suspended{background:rgba(244,63,94,.18);color:#f43f5e}
    .credits{font-weight:700;color:#f59e0b}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .expand-icon{transition:transform .3s}
    .admin-card.expanded .expand-icon{transform:rotate(180deg)}
    .users-panel{max-height:0;overflow:hidden;transition:max-height .4s ease;background:rgba(0,0,0,.2);border-top:1px solid rgba(255,255,255,.05)}
    .admin-card.expanded .users-panel{max-height:2000px}
    .users-list{padding:16px;display:flex;flex-direction:column;gap:12px}
    .user-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:hidden}
    .user-header{padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;cursor:pointer}
    .user-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#f97316,#f43f5e);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
    .user-stats{max-height:0;overflow:hidden;transition:max-height .3s ease;background:rgba(0,0,0,.15);border-top:1px solid rgba(255,255,255,.04)}
    .user-card.expanded .user-stats{max-height:500px}
    .stats-grid{padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .mini-stat{text-align:center;padding:12px;background:rgba(255,255,255,.02);border-radius:10px}
    .mini-stat-value{font-family:'Space Grotesk',sans-serif;font-size:20px;color:#fff}
    .mini-stat-label{font-size:10px;color:#64748b;text-transform:uppercase;margin-top:4px}
    .no-users{padding:20px;text-align:center;color:#64748b;font-size:13px}
    dialog{border:none;background:transparent;padding:0}
    dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
    .modal{width:min(420px,90vw);background:rgba(10,12,18,.97);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:28px}
    .modal h3{font-family:'Space Grotesk',sans-serif;margin-bottom:18px}
    .field{margin-bottom:16px}
    .field label{display:block;margin-bottom:6px;font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.08em}
    .field input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#f8fafc;font-family:inherit}
    .field input:focus{outline:none;border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.2)}
    .modal-actions{display:flex;gap:12px;margin-top:8px}
    .toast{position:fixed;bottom:28px;right:28px;padding:14px 22px;background:rgba(10,12,18,.95);border:1px solid rgba(255,255,255,.1);border-radius:14px;opacity:0;transform:translateY(16px);transition:all .3s}
    .toast.show{opacity:1;transform:translateY(0)}
    .empty{padding:50px 20px;text-align:center;color:#64748b;border:1px dashed rgba(255,255,255,.1);border-radius:18px}
    .user-actions{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 14px}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Super Admin</h1><p style="color:#64748b;margin-top:4px">Platform Control Center</p></div>
    <div class="hdr-right">
      <button class="btn btn-ghost" onclick="location.href='/'">Back to Tool</button>
      <button class="btn btn-primary" onclick="openModal()">+ New Admin</button>
    </div>
  </header>
  <section class="stats">
    <div class="stat"><div class="stat-label">Total Admins</div><div class="stat-value" id="sAdmins">—</div></div>
    <div class="stat"><div class="stat-label">Total Users</div><div class="stat-value" id="sUsers">—</div></div>
    <div class="stat"><div class="stat-label">Sessions Today</div><div class="stat-value" id="sActive">—</div></div>
    <div class="stat"><div class="stat-label">Credits Pool</div><div class="stat-value" id="sCredits">—</div></div>
  </section>
  <div class="panel">
    <h2>Admins (click to expand users)</h2>
    <div id="adminList" class="list"><div class="empty">Loading...</div></div>
  </div>
</div>
<dialog id="dlg">
  <div class="modal">
    <h3>Create Admin</h3>
    <form id="frm">
      <div class="field"><label>Business Name</label><input id="fName" required placeholder="Acme Corp"></div>
      <div class="field"><label>Username</label><input id="fUser" required placeholder="acme"></div>
      <div class="field"><label>Password</label><input id="fPass" type="password" required placeholder="Strong password"></div>
      <div class="field"><label>Credits</label><input id="fCred" type="number" value="100"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Create</button>
      </div>
    </form>
  </div>
</dialog>
<div class="toast" id="toast"></div>
<script>
const listEl=document.getElementById('adminList'),toastEl=document.getElementById('toast');
let adminsData=[];

document.getElementById('frm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/super-admin/admins',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('fName').value,username:document.getElementById('fUser').value,password:document.getElementById('fPass').value,credits:+document.getElementById('fCred').value||0})});if(!r.ok){const d=await r.json();throw new Error(d.error||'Failed')}toast('Admin created');closeModal();e.target.reset();loadAll()}catch(err){toast(err.message||'Failed',1)}};
function openModal(){document.getElementById('dlg').showModal()}
function closeModal(){document.getElementById('dlg').close()}
async function loadAll(){await Promise.all([loadStats(),loadAdmins()])}
async function loadStats(){try{const r=await fetch('/api/super-admin/stats');if(!r.ok)return;const d=await r.json();const s=d.stats||d;document.getElementById('sAdmins').textContent=s.totalAdmins||0;document.getElementById('sUsers').textContent=s.totalUsers||0;document.getElementById('sActive').textContent=s.sessionsToday||0;document.getElementById('sCredits').textContent=s.totalAdminCredits||0}catch(_){}}
async function loadAdmins(){listEl.innerHTML='<div class="empty">Loading...</div>';try{const r=await fetch('/api/super-admin/admins');if(!r.ok)throw 0;const d=await r.json();adminsData=d.admins||[];render()}catch(_){listEl.innerHTML='<div class="empty">Failed to load</div>'}}

function render(){
  if(!adminsData.length){listEl.innerHTML='<div class="empty">No admins yet</div>';return}
  listEl.innerHTML=adminsData.map(a=>`
    <div class="admin-card" id="admin-${a.id}">
      <div class="admin-header" onclick="toggleAdmin('${a.id}')">
        <div class="avatar">${(a.name||a.username||'?').slice(0,2).toUpperCase()}</div>
        <div>
          <div style="font-weight:600">${a.name||a.username}</div>
          <div class="meta">@${a.username} · ${a.userCount||0} users</div>
          <span class="pill ${a.status==='active'?'active':'suspended'}">${a.status}</span>
          <span class="credits" style="margin-left:8px">Credits: ${a.credits||0}</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <svg class="expand-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <div class="users-panel">
        <div class="users-list" id="users-${a.id}"><div class="no-users">Loading users...</div></div>
        <div style="padding:0 16px 16px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();addCred('${a.id}')">Add Credits</button>
          <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();toggleSt('${a.id}','${a.status}')">${a.status==='active'?'Suspend':'Activate'}</button>
          <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();forceOut('${a.id}')">Force Logout</button>
          <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();delAdmin('${a.id}')">Delete</button>
        </div>
      </div>
    </div>
  `).join('');
}

async function toggleAdmin(id){
  const card=document.getElementById('admin-'+id);
  const wasExpanded=card.classList.contains('expanded');
  document.querySelectorAll('.admin-card.expanded').forEach(c=>c.classList.remove('expanded'));
  if(!wasExpanded){
    card.classList.add('expanded');
    loadUsersForAdmin(id);
  }
}

async function loadUsersForAdmin(adminId){
  const container=document.getElementById('users-'+adminId);
  container.innerHTML='<div class="no-users">Loading users...</div>';
  try{
    const r=await fetch(`/api/super-admin/admins/${adminId}/users`);
    if(!r.ok)throw 0;
    const d=await r.json();
    const users=d.users||[];
    if(!users.length){container.innerHTML='<div class="no-users">No users under this admin</div>';return}
    container.innerHTML=users.map(u=>`
      <div class="user-card" id="user-${u.id}">
        <div class="user-header" onclick="toggleUser('${u.id}','${adminId}')">
          <div class="user-avatar">${(u.username||'?').slice(0,2).toUpperCase()}</div>
          <div>
            <div style="font-weight:500">${u.username}</div>
            <span class="pill ${u.status==='active'?'active':'suspended'}" style="font-size:10px">${u.status}</span>
            <span style="color:#64748b;font-size:12px;margin-left:6px">Credits: ${u.credits||0}</span>
          </div>
          <svg class="expand-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="user-stats" id="ustats-${u.id}">
          <div class="stats-grid">
            <div class="mini-stat"><div class="mini-stat-value">${u.credits||0}</div><div class="mini-stat-label">Credits</div></div>
            <div class="mini-stat"><div class="mini-stat-value">${u.sessionCount||0}</div><div class="mini-stat-label">Sessions</div></div>
            <div class="mini-stat"><div class="mini-stat-value">${u.permissions?.canAnalyze?'Yes':'No'}</div><div class="mini-stat-label">Can Analyze</div></div>
          </div>
          <div class="user-actions">
            <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();forceOutUser('${u.id}')">Force Logout</button>
          </div>
        </div>
      </div>
    `).join('');
  }catch(_){container.innerHTML='<div class="no-users">Failed to load users</div>'}
}

function toggleUser(userId,adminId){
  const card=document.getElementById('user-'+userId);
  card.classList.toggle('expanded');
}

async function forceOutUser(id){if(!confirm('Force logout this user?'))return;try{const r=await fetch(`/api/super-admin/users/${id}/force-logout`,{method:'POST'});if(!r.ok)throw 0;toast('User logged out')}catch(_){toast('Failed',1)}}
async function addCred(id){const a=prompt('Credits to add:');if(!a)return;try{const r=await fetch(`/api/super-admin/admins/${id}/credits`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:+a})});if(!r.ok)throw 0;toast('Credits added');loadAll()}catch(_){toast('Failed',1)}}
async function toggleSt(id,cur){try{const r=await fetch(`/api/super-admin/admins/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:cur==='active'?'suspended':'active'})});if(!r.ok)throw 0;toast('Status updated');loadAll()}catch(_){toast('Failed',1)}}
async function forceOut(id){if(!confirm('Force logout this admin?'))return;try{const r=await fetch(`/api/super-admin/admins/${id}/force-logout`,{method:'POST'});if(!r.ok)throw 0;toast('Admin logged out')}catch(_){toast('Failed',1)}}
async function delAdmin(id){if(!confirm('DELETE this admin permanently? This will also remove all their users.'))return;try{const r=await fetch(`/api/super-admin/admins/${id}`,{method:'DELETE'});if(!r.ok)throw 0;toast('Admin deleted');loadAll()}catch(_){toast('Delete failed',1)}}
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/login'}
function toast(m,err){toastEl.textContent=m;toastEl.style.borderColor=err?'rgba(244,63,94,.4)':'rgba(16,185,129,.3)';toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),2500)}
loadAll();
</script>
</body>
</html>
