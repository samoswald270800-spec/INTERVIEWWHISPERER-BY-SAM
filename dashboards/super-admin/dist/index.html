<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #334155; }
    h1 { font-size: 1.75rem; color: #f1f5f9; }
    .btn { padding: 0.5rem 1rem; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-secondary { background: #475569; color: white; }
    .btn-secondary:hover { background: #64748b; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: #1e293b; padding: 1.5rem; border-radius: 0.75rem; }
    .stat-card h3 { color: #94a3b8; font-size: 0.875rem; margin-bottom: 0.5rem; }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: #f1f5f9; }
    .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1.5rem; }
    .card h2 { margin-bottom: 1rem; font-size: 1.25rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; font-weight: 500; }
    .actions { display: flex; gap: 0.5rem; }
    .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 200px; }
    .form-group label { display: block; margin-bottom: 0.25rem; color: #94a3b8; font-size: 0.875rem; }
    .form-group input { width: 100%; padding: 0.5rem; border: 1px solid #334155; border-radius: 0.375rem; background: #0f172a; color: #e2e8f0; }
    .expandable { cursor: pointer; }
    .expandable:hover { background: #334155; }
    .user-row { background: #0f172a; }
    .hidden { display: none; }
    .status-active { color: #22c55e; }
    .status-suspended { color: #ef4444; }
    .loading { text-align: center; padding: 2rem; color: #94a3b8; }
    .error { color: #ef4444; padding: 1rem; background: #450a0a; border-radius: 0.5rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔐 Super Admin Dashboard</h1>
      <div>
        <a href="/" class="btn btn-secondary">← Back to Tool</a>
        <button onclick="logout()" class="btn btn-danger" style="margin-left: 0.5rem;">Logout</button>
      </div>
    </header>

    <div class="stats" id="stats">
      <div class="stat-card"><h3>Total Admins</h3><div class="value" id="stat-admins">-</div></div>
      <div class="stat-card"><h3>Total Users</h3><div class="value" id="stat-users">-</div></div>
      <div class="stat-card"><h3>Sessions Today</h3><div class="value" id="stat-sessions">-</div></div>
      <div class="stat-card"><h3>Total Admin Credits</h3><div class="value" id="stat-credits">-</div></div>
    </div>

    <div class="card">
      <h2>Create New Admin</h2>
      <form id="create-admin-form">
        <div class="form-row">
          <div class="form-group"><label>Name</label><input type="text" name="name" required></div>
          <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
          <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
          <div class="form-group"><label>Initial Credits</label><input type="number" name="credits" value="0" min="0"></div>
        </div>
        <button type="submit" class="btn btn-primary">Create Admin</button>
      </form>
    </div>

    <div class="card">
      <h2>Admins</h2>
      <div id="admins-loading" class="loading">Loading...</div>
      <table id="admins-table" class="hidden">
        <thead><tr><th>Name</th><th>Username</th><th>Credits</th><th>Users</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="admins-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function api(path, opts = {}) {
      const res = await fetch('/api/super-admin' + path, {
        ...opts,
        headers: { 'Content-Type': 'application/json', ...opts.headers },
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
      return res.json();
    }

    async function loadStats() {
      const data = await api('/stats');
      if (data.ok) {
        document.getElementById('stat-admins').textContent = data.stats.totalAdmins;
        document.getElementById('stat-users').textContent = data.stats.totalUsers;
        document.getElementById('stat-sessions').textContent = data.stats.sessionsToday;
        document.getElementById('stat-credits').textContent = data.stats.totalAdminCredits;
      }
    }

    async function loadAdmins() {
      const data = await api('/admins');
      document.getElementById('admins-loading').classList.add('hidden');
      document.getElementById('admins-table').classList.remove('hidden');
      const tbody = document.getElementById('admins-body');
      tbody.innerHTML = '';
      if (data.ok && data.admins) {
        data.admins.forEach(admin => {
          const row = document.createElement('tr');
          row.className = 'expandable';
          row.innerHTML = `
            <td>${admin.name}</td>
            <td>${admin.username}</td>
            <td>${admin.credits} <button class="btn btn-secondary" style="padding:0.25rem 0.5rem;font-size:0.75rem" onclick="event.stopPropagation();addCredits('${admin.id}')">+/-</button></td>
            <td>${admin.userCount}</td>
            <td class="status-${admin.status}">${admin.status}</td>
            <td class="actions">
              <button class="btn btn-secondary" onclick="event.stopPropagation();forceLogoutAdmin('${admin.id}')">Force Logout</button>
              <button class="btn btn-danger" onclick="event.stopPropagation();deleteAdmin('${admin.id}')">Delete</button>
            </td>
          `;
          row.onclick = () => toggleUsers(admin.id, row);
          tbody.appendChild(row);
        });
      }
    }

    async function toggleUsers(adminId, row) {
      const existingRows = document.querySelectorAll(`.users-${adminId}`);
      if (existingRows.length > 0) {
        existingRows.forEach(r => r.remove());
        return;
      }
      const data = await api(`/admins/${adminId}/users`);
      if (data.ok && data.users) {
        data.users.forEach(user => {
          const userRow = document.createElement('tr');
          userRow.className = `user-row users-${adminId}`;
          userRow.innerHTML = `
            <td style="padding-left:2rem">↳ ${user.username}</td>
            <td></td>
            <td>${user.credits}</td>
            <td></td>
            <td class="status-${user.status}">${user.status}</td>
            <td class="actions">
              <button class="btn btn-secondary" onclick="forceLogoutUser('${user.id}')">Force Logout</button>
            </td>
          `;
          row.after(userRow);
        });
      }
    }

    async function addCredits(adminId) {
      const amount = prompt('Enter credit amount (positive to add, negative to deduct):');
      if (amount === null) return;
      const num = parseInt(amount);
      if (isNaN(num) || num === 0) return alert('Invalid amount');
      await api(`/admins/${adminId}/credits`, { method: 'POST', body: { amount: num } });
      loadAdmins();
      loadStats();
    }

    async function forceLogoutAdmin(adminId) {
      if (!confirm('Force logout this admin?')) return;
      await api(`/admins/${adminId}/force-logout`, { method: 'POST' });
      alert('Admin logged out');
    }

    async function forceLogoutUser(userId) {
      if (!confirm('Force logout this user?')) return;
      await api(`/users/${userId}/force-logout`, { method: 'POST' });
      alert('User logged out');
    }

    async function deleteAdmin(adminId) {
      if (!confirm('Delete this admin? All their users will also be logged out and deleted!')) return;
      await api(`/admins/${adminId}`, { method: 'DELETE' });
      loadAdmins();
      loadStats();
    }

    document.getElementById('create-admin-form').onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = await api('/admins', {
        method: 'POST',
        body: {
          name: form.name.value,
          username: form.username.value,
          password: form.password.value,
          credits: parseInt(form.credits.value) || 0
        }
      });
      if (data.ok) {
        form.reset();
        loadAdmins();
        loadStats();
      } else {
        alert(data.error || 'Failed to create admin');
      }
    };

    function logout() {
      fetch('/api/logout', { method: 'POST' }).then(() => location.href = '/login');
    }

    loadStats();
    loadAdmins();
  </script>
</body>
</html>
