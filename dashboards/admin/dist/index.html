<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#030306;--glass:rgba(12,12,18,0.7);--border:rgba(255,255,255,0.06);--cyan:#06B6D4;--teal:#14B8A6;--violet:#8B5CF6;--rose:#E11D48;--emerald:#10B981;--text:#F8FAFC;--muted:rgba(248,250,252,0.35)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .ambient{position:fixed;inset:0;z-index:-1;overflow:hidden}
    .orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:0.35;animation:float 20s ease-in-out infinite}
    .orb-1{width:500px;height:500px;background:linear-gradient(135deg,var(--cyan),var(--teal));top:-150px;left:-100px}
    .orb-2{width:400px;height:400px;background:linear-gradient(135deg,var(--violet),var(--rose));bottom:-100px;right:-50px;animation-delay:-10s}
    @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-30px)}}
    .container{display:flex;min-height:100vh}
    .sidebar{width:280px;background:var(--glass);backdrop-filter:blur(40px);border-right:1px solid var(--border);padding:32px 20px;display:flex;flex-direction:column;position:fixed;height:100vh;animation:slideIn 0.6s ease}
    @keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
    .logo{display:flex;align-items:center;gap:14px;padding-bottom:32px;border-bottom:1px solid var(--border);margin-bottom:24px}
    .logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--cyan),var(--teal));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 8px 32px rgba(6,182,212,0.3)}
    .logo h1{font-size:16px;font-weight:600}
    .logo span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em}
    .credits-box{background:linear-gradient(135deg,rgba(6,182,212,0.1),rgba(20,184,166,0.05));border:1px solid rgba(6,182,212,0.2);border-radius:16px;padding:20px;margin-bottom:24px}
    .credits-label{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:8px}
    .credits-value{font-size:32px;font-weight:700;font-family:monospace;background:linear-gradient(135deg,var(--cyan),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .nav-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;color:rgba(248,250,252,0.6);text-decoration:none;font-size:14px;font-weight:500;margin-bottom:4px;transition:all 0.2s;cursor:pointer;border:1px solid transparent}
    .nav-item:hover{background:rgba(255,255,255,0.02);transform:translateX(4px)}
    .nav-item.active{background:linear-gradient(135deg,rgba(6,182,212,0.15),rgba(20,184,166,0.1));border-color:rgba(6,182,212,0.2);color:var(--text)}
    .back-btn{margin-top:auto;padding:14px 16px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:12px;color:rgba(248,250,252,0.6);font-size:14px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:10px}
    .back-btn:hover{background:rgba(139,92,246,0.1);border-color:rgba(139,92,246,0.3);color:var(--text);transform:translateY(-2px)}
    .main{flex:1;margin-left:280px;padding:40px;animation:fadeIn 0.8s ease 0.2s both}
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
    .header h2{font-size:28px;font-weight:600;margin-bottom:6px}
    .header p{color:var(--muted);font-size:14px}
    .btn{padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:8px;border:none}
    .btn-primary{background:linear-gradient(135deg,var(--cyan),var(--teal));color:white;box-shadow:0 4px 20px rgba(6,182,212,0.3)}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(6,182,212,0.4)}
    .btn-secondary{background:rgba(255,255,255,0.02);border:1px solid var(--border);color:var(--text)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:40px}
    .stat{background:var(--glass);backdrop-filter:blur(40px);border:1px solid var(--border);border-radius:20px;padding:28px;position:relative;overflow:hidden;transition:all 0.4s;animation:scaleIn 0.5s ease both}
    .stat:nth-child(1){animation-delay:0.1s}.stat:nth-child(2){animation-delay:0.15s}.stat:nth-child(3){animation-delay:0.2s}.stat:nth-child(4){animation-delay:0.25s}
    @keyframes scaleIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
    .stat:hover{transform:translateY(-4px);border-color:rgba(255,255,255,0.1);box-shadow:0 20px 60px rgba(0,0,0,0.3)}
    .stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:20px 20px 0 0}
    .stat:nth-child(1)::before{background:linear-gradient(90deg,var(--cyan),var(--teal))}
    .stat:nth-child(2)::before{background:linear-gradient(90deg,var(--violet),var(--rose))}
    .stat:nth-child(3)::before{background:linear-gradient(90deg,var(--emerald),var(--teal))}
    .stat:nth-child(4)::before{background:linear-gradient(90deg,var(--rose),var(--violet))}
    .stat-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,0.02);border:1px solid var(--border);margin-bottom:20px}
    .stat-value{font-size:36px;font-weight:700;margin-bottom:4px;font-family:monospace}
    .stat-label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em}
    .table-section{background:var(--glass);backdrop-filter:blur(40px);border:1px solid var(--border);border-radius:24px;overflow:hidden}
    .table-header{display:flex;justify-content:space-between;align-items:center;padding:24px 28px;border-bottom:1px solid var(--border)}
    .search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:10px;padding:10px 16px}
    .search input{background:none;border:none;color:var(--text);font-size:13px;width:200px;outline:none}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;padding:16px 28px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);background:rgba(0,0,0,0.2)}
    td{padding:20px 28px;font-size:14px;border-bottom:1px solid var(--border)}
    tr:hover td{background:rgba(255,255,255,0.02)}
    .avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--teal));display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600}
    .badge.active{background:rgba(16,185,129,0.15);color:var(--emerald)}
    .badge.suspended{background:rgba(225,29,72,0.15);color:var(--rose)}
    .perm{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;background:rgba(255,255,255,0.02);border:1px solid var(--border);color:rgba(248,250,252,0.6);margin-right:6px}
    .perm.on{background:rgba(139,92,246,0.15);border-color:rgba(139,92,246,0.3);color:var(--violet)}
    .action-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.02);border:1px solid var(--border);color:rgba(248,250,252,0.6);cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;justify-content:center;font-size:14px;margin-right:6px}
    .action-btn:hover{background:rgba(6,182,212,0.15);border-color:rgba(6,182,212,0.3);color:var(--cyan);transform:scale(1.1)}
    .loading{display:flex;align-items:center;justify-content:center;padding:60px}
    .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:all 0.3s}
    .modal.active{opacity:1;visibility:visible}
    .modal-content{background:var(--glass);border:1px solid var(--border);border-radius:24px;padding:32px;width:100%;max-width:480px;transform:scale(0.9);transition:all 0.4s}
    .modal.active .modal-content{transform:scale(1)}
    .form-group{margin-bottom:20px}
    .form-label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:10px}
    .form-input{width:100%;padding:14px 18px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;transition:all 0.3s}
    .form-input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(6,182,212,0.15)}
    .checkbox{display:flex;gap:20px;margin-top:8px}
    .checkbox label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:rgba(248,250,252,0.6)}
    .checkbox input{width:18px;height:18px;accent-color:var(--cyan)}
    .toast{position:fixed;bottom:32px;right:32px;background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:16px 24px;display:flex;align-items:center;gap:12px;transform:translateY(100px);opacity:0;transition:all 0.4s;z-index:2000}
    .toast.show{transform:translateY(0);opacity:1}
  </style>
</head>
<body>
  <div class="ambient"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
  <div class="container">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon"></div>
        <div><h1>Dashboard</h1><span>Admin Panel</span></div>
      </div>
      <div class="credits-box">
        <div class="credits-label">Available Credits</div>
        <div class="credits-value" id="cred">0</div>
      </div>
      <nav>
        <a class="nav-item active"> Users</a>
        <a class="nav-item"> Analytics</a>
      </nav>
      <button class="back-btn" onclick="location.href='/'"> Back to Tool</button>
    </aside>
    <main class="main">
      <header class="header">
        <div><h2>User Management</h2><p>Manage your candidates</p></div>
        <div style="display:flex;gap:12px">
          <button class="btn btn-secondary" onclick="load()"> Refresh</button>
          <button class="btn btn-primary" onclick="openModal()">+ New User</button>
        </div>
      </header>
      <div class="stats">
        <div class="stat"><div class="stat-icon"></div><div class="stat-value" id="s1">0</div><div class="stat-label">Total Users</div></div>
        <div class="stat"><div class="stat-icon"></div><div class="stat-value" id="s2">0</div><div class="stat-label">Active</div></div>
        <div class="stat"><div class="stat-icon"></div><div class="stat-value" id="s3">0</div><div class="stat-label">My Credits</div></div>
        <div class="stat"><div class="stat-icon"></div><div class="stat-value" id="s4">0</div><div class="stat-label">Assigned</div></div>
      </div>
      <section class="table-section">
        <div class="table-header">
          <h3>All Users</h3>
          <div class="search"><span></span><input placeholder="Search..." oninput="filter(this.value)"></div>
        </div>
        <div id="tbl"><div class="loading"><div class="spinner"></div></div></div>
      </section>
    </main>
  </div>
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 style="margin-bottom:24px">Create User</h3>
      <form onsubmit="create(event)">
        <div class="form-group"><label class="form-label">Username</label><input class="form-input" id="fuser" required></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" id="fpass" required></div>
        <div class="form-group"><label class="form-label">Credits</label><input type="number" class="form-input" id="fcred" value="10"></div>
        <div class="form-group"><label class="form-label">Permissions</label><div class="checkbox"><label><input type="checkbox" id="pExp" checked>Expand</label><label><input type="checkbox" id="pAna" checked>Analyze</label></div></div>
        <div style="display:flex;gap:12px;margin-top:24px">
          <button type="button" class="btn btn-secondary" style="flex:1" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex:1">Create</button>
        </div>
      </form>
    </div>
  </div>
  <div class="toast" id="toast"><span id="ti"></span><span id="tm"></span></div>
  <script>
    let data=[],myCred=0;
    document.addEventListener('DOMContentLoaded',()=>{load();loadMe()});
    async function load(){try{const r=await fetch('/api/admin/users');const d=await r.json();data=d.users||[];render();stats()}catch(e){toast('Failed',0)}}
    async function loadMe(){try{const r=await fetch('/api/me');const d=await r.json();myCred=d.credits||0;document.getElementById('cred').textContent=myCred;document.getElementById('s3').textContent=myCred}catch(e){}}
    function stats(){document.getElementById('s1').textContent=data.length;document.getElementById('s2').textContent=data.filter(u=>u.status==='active').length;document.getElementById('s4').textContent=data.reduce((s,u)=>s+(u.credits||0),0)}
    function render(){const c=document.getElementById('tbl');if(!data.length){c.innerHTML='<p style="padding:60px;text-align:center;color:var(--muted)">No users. Create your first!</p>';return}c.innerHTML='<table><thead><tr><th>User</th><th>Status</th><th>Credits</th><th>Permissions</th><th>Actions</th></tr></thead><tbody>'+data.map(u=>'<tr><td style="display:flex;align-items:center;gap:14px"><div class="avatar">'+(u.username||'?')[0].toUpperCase()+'</div><div><b>@'+u.username+'</b></div></td><td><span class="badge '+u.status+'">'+u.status+'</span></td><td style="font-family:monospace;color:var(--cyan)">'+(u.credits||0)+'</td><td><span class="perm '+(u.permissions?.canExpand?'on':'')+'">Expand</span><span class="perm '+(u.permissions?.canAnalyze?'on':'')+'">Analyze</span></td><td><button class="action-btn" onclick="toggle(\''+u.id+'\',\''+u.status+'\')">'+(u.status==='active'?'':'')+'</button><button class="action-btn" onclick="logout(\''+u.id+'\')"></button><button class="action-btn" onclick="del(\''+u.id+'\')"></button></td></tr>').join('')+'</tbody></table>'}
    function filter(q){const f=data.filter(u=>(u.username||'').toLowerCase().includes(q.toLowerCase()));const o=data;data=f;render();data=o}
    async function create(e){e.preventDefault();try{const r=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('fuser').value,password:document.getElementById('fpass').value,credits:+document.getElementById('fcred').value||0,permissions:{canExpand:document.getElementById('pExp').checked,canAnalyze:document.getElementById('pAna').checked}})});const d=await r.json();if(d.success){toast('Created!',1);closeModal();load();loadMe()}else{toast(d.error||'Failed',0)}}catch(e){toast('Failed',0)}}
    async function toggle(id,st){try{const r=await fetch('/api/admin/users/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:st==='active'?'suspended':'active'})});if((await r.json()).success){toast('Updated!',1);load()}else{toast('Failed',0)}}catch(e){toast('Failed',0)}}
    async function logout(id){if(!confirm('Force logout?'))return;try{await fetch('/api/admin/users/'+id+'/force-logout',{method:'POST'});toast('Logged out!',1)}catch(e){toast('Failed',0)}}
    async function del(id){if(!confirm('Delete?'))return;try{const r=await fetch('/api/admin/users/'+id,{method:'DELETE'});if((await r.json()).success){toast('Deleted!',1);load();loadMe()}else{toast('Failed',0)}}catch(e){toast('Failed',0)}}
    function openModal(){document.getElementById('modal').classList.add('active')}
    function closeModal(){document.getElementById('modal').classList.remove('active')}
    function toast(m,s){const t=document.getElementById('toast');document.getElementById('ti').textContent=s?'':'';document.getElementById('tm').textContent=m;t.className='toast show';setTimeout(()=>t.classList.remove('show'),3000)}
    document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
  </script>
</body>
</html>
