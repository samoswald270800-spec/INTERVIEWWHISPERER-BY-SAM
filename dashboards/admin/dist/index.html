<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #334155; }
    h1 { font-size: 1.75rem; color: #f1f5f9; }
    .btn { padding: 0.5rem 1rem; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-secondary { background: #475569; color: white; }
    .btn-secondary:hover { background: #64748b; }
    .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: #1e293b; padding: 1.5rem; border-radius: 0.75rem; }
    .stat-card h3 { color: #94a3b8; font-size: 0.875rem; margin-bottom: 0.5rem; }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: #f1f5f9; }
    .card { background: #1e293b; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1.5rem; }
    .card h2 { margin-bottom: 1rem; font-size: 1.25rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; font-weight: 500; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 150px; }
    .form-group label { display: block; margin-bottom: 0.25rem; color: #94a3b8; font-size: 0.875rem; }
    .form-group input { width: 100%; padding: 0.5rem; border: 1px solid #334155; border-radius: 0.375rem; background: #0f172a; color: #e2e8f0; }
    .status-active { color: #22c55e; }
    .status-suspended { color: #ef4444; }
    .loading { text-align: center; padding: 2rem; color: #94a3b8; }
    .hidden { display: none; }
    .checkbox-group { display: flex; gap: 1rem; align-items: center; }
    .checkbox-group label { display: flex; align-items: center; gap: 0.25rem; color: #94a3b8; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 Admin Dashboard</h1>
      <div>
        <a href="/" class="btn btn-secondary">← Back to Tool</a>
        <button onclick="logout()" class="btn btn-danger" style="margin-left: 0.5rem;">Logout</button>
      </div>
    </header>

    <div class="stats" id="stats">
      <div class="stat-card"><h3>Your Credits</h3><div class="value" id="stat-credits">-</div></div>
      <div class="stat-card"><h3>Total Users</h3><div class="value" id="stat-users">-</div></div>
      <div class="stat-card"><h3>Active Users</h3><div class="value" id="stat-active">-</div></div>
      <div class="stat-card"><h3>Sessions Today</h3><div class="value" id="stat-sessions">-</div></div>
      <div class="stat-card"><h3>Credits Used Today</h3><div class="value" id="stat-used">-</div></div>
    </div>

    <div class="card">
      <h2>Create New User</h2>
      <form id="create-user-form">
        <div class="form-row">
          <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
          <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
          <div class="form-group"><label>Initial Credits</label><input type="number" name="credits" value="0" min="0"></div>
        </div>
        <div class="form-row">
          <div class="checkbox-group">
            <label><input type="checkbox" name="canExpand" checked> Can Expand</label>
            <label><input type="checkbox" name="canAnalyze" checked> Can Analyze Screen</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Create User</button>
      </form>
    </div>

    <div class="card">
      <h2>Users</h2>
      <div id="users-loading" class="loading">Loading...</div>
      <table id="users-table" class="hidden">
        <thead><tr><th>Username</th><th>Credits</th><th>Sessions</th><th>Permissions</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function api(path, opts = {}) {
      const res = await fetch('/api/admin' + path, {
        ...opts,
        headers: { 'Content-Type': 'application/json', ...opts.headers },
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
      return res.json();
    }

    async function loadStats() {
      const data = await api('/stats');
      if (data.ok) {
        document.getElementById('stat-credits').textContent = data.stats.credits;
        document.getElementById('stat-users').textContent = data.stats.totalUsers;
        document.getElementById('stat-active').textContent = data.stats.activeUsers;
        document.getElementById('stat-sessions').textContent = data.stats.sessionsToday;
        document.getElementById('stat-used').textContent = data.stats.creditsUsedToday;
      }
    }

    async function loadUsers() {
      const data = await api('/users');
      document.getElementById('users-loading').classList.add('hidden');
      document.getElementById('users-table').classList.remove('hidden');
      const tbody = document.getElementById('users-body');
      tbody.innerHTML = '';
      if (data.ok && data.users) {
        data.users.forEach(user => {
          const perms = user.permissions || {};
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${user.username}</td>
            <td>${user.credits} 
              <button class="btn btn-secondary btn-sm" onclick="assignCredits('${user.id}')">+</button>
              <button class="btn btn-secondary btn-sm" onclick="reclaimCredits('${user.id}')">-</button>
            </td>
            <td>${user.sessionCount || 0}</td>
            <td>
              <label style="font-size:0.75rem;color:#94a3b8"><input type="checkbox" ${perms.canExpand ? 'checked' : ''} onchange="updatePerm('${user.id}','canExpand',this.checked)"> Expand</label>
              <label style="font-size:0.75rem;color:#94a3b8"><input type="checkbox" ${perms.canAnalyze ? 'checked' : ''} onchange="updatePerm('${user.id}','canAnalyze',this.checked)"> Analyze</label>
            </td>
            <td class="status-${user.status}">${user.status}</td>
            <td class="actions">
              <button class="btn btn-secondary btn-sm" onclick="forceLogoutUser('${user.id}')">Force Logout</button>
              <button class="btn btn-secondary btn-sm" onclick="resetPassword('${user.id}')">Reset PW</button>
              <button class="btn btn-danger btn-sm" onclick="deleteUser('${user.id}')">Delete</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      }
    }

    async function assignCredits(userId) {
      const amount = prompt('Credits to assign:');
      if (!amount) return;
      const num = parseInt(amount);
      if (isNaN(num) || num <= 0) return alert('Enter a positive number');
      const res = await api(`/users/${userId}/credits/assign`, { method: 'POST', body: { amount: num } });
      if (res.ok) { loadUsers(); loadStats(); } else alert(res.error);
    }

    async function reclaimCredits(userId) {
      const amount = prompt('Credits to reclaim:');
      if (!amount) return;
      const num = parseInt(amount);
      if (isNaN(num) || num <= 0) return alert('Enter a positive number');
      const res = await api(`/users/${userId}/credits/reclaim`, { method: 'POST', body: { amount: num } });
      if (res.ok) { loadUsers(); loadStats(); } else alert(res.error);
    }

    async function updatePerm(userId, perm, value) {
      await api(`/users/${userId}/permissions`, { method: 'PATCH', body: { permissions: { [perm]: value } } });
    }

    async function forceLogoutUser(userId) {
      if (!confirm('Force logout this user?')) return;
      await api(`/users/${userId}/force-logout`, { method: 'POST' });
      alert('User logged out');
    }

    async function resetPassword(userId) {
      const pw = prompt('Enter new password:');
      if (!pw) return;
      const res = await api(`/users/${userId}/reset-password`, { method: 'POST', body: { password: pw } });
      if (res.ok) alert('Password reset'); else alert(res.error || 'Failed');
    }

    async function deleteUser(userId) {
      if (!confirm('Delete this user? Any remaining credits will be returned to you.')) return;
      await api(`/users/${userId}`, { method: 'DELETE' });
      loadUsers();
      loadStats();
    }

    document.getElementById('create-user-form').onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = await api('/users', {
        method: 'POST',
        body: {
          username: form.username.value,
          password: form.password.value,
          credits: parseInt(form.credits.value) || 0,
          permissions: {
            canExpand: form.canExpand.checked,
            canAnalyze: form.canAnalyze.checked
          }
        }
      });
      if (data.ok) {
        form.reset();
        form.canExpand.checked = true;
        form.canAnalyze.checked = true;
        loadUsers();
        loadStats();
      } else {
        alert(data.error || 'Failed to create user');
      }
    };

    function logout() {
      fetch('/api/logout', { method: 'POST' }).then(() => location.href = '/login');
    }

    loadStats();
    loadUsers();
  </script>
</body>
</html>
