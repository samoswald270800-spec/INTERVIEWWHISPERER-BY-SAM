<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-card: #12121a;
      --border: rgba(255,255,255,0.08);
      --text-white: #fff;
      --text-muted: #888;
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 24px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .credit-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 10px;
    }
    .credit-badge .label { color: var(--text-muted); font-size: 12px; }
    .credit-badge .value { color: var(--accent); font-weight: 700; font-size: 18px; }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); color: var(--text-white); }
    .btn-danger { background: var(--danger); color: white; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .stat-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .stat-card .value { font-size: 32px; font-weight: 700; }
    .stat-card.cyan .value { color: var(--accent); }
    .stat-card.green .value { color: var(--success); }
    .stat-card.yellow .value { color: var(--warning); }
    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .panel-header h2 { font-size: 16px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 20px; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-size: 11px; text-transform: uppercase; color: var(--text-muted); }
    td { font-size: 14px; }
    tr:hover { background: rgba(255,255,255,0.02); }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 500; }
    .badge-active { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .badge-paused { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .perm-icons { display: flex; gap: 8px; }
    .perm-icon {
      width: 24px; height: 24px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
    }
    .perm-icon.on { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .perm-icon.off { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.2s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%; max-width: 480px;
    }
    .modal h3 { font-size: 18px; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input, .form-group select {
      width: 100%; padding: 12px 14px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-white);
      font-size: 14px;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); }
    .checkbox-group { display: flex; gap: 16px; }
    .checkbox-group label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 14px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 1001;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 Admin Dashboard</h1>
      <div style="display:flex;align-items:center;gap:24px;">
        <div class="credit-badge">
          <span class="label">Your Credits</span>
          <span class="value" id="myCredits">-</span>
        </div>
        <button class="btn btn-secondary" onclick="refreshData()">Refresh</button>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
      </div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card cyan"><div class="label">Total Users</div><div class="value" id="statUsers">-</div></div>
      <div class="stat-card green"><div class="label">Active Users</div><div class="value" id="statActive">-</div></div>
      <div class="stat-card yellow"><div class="label">Sessions Today</div><div class="value" id="statSessions">-</div></div>
      <div class="stat-card"><div class="label">Credits Used Today</div><div class="value" id="statCreditsUsed">-</div></div>
    </div>
    
    <div class="panel">
      <div class="panel-header">
        <h2>Manage Users</h2>
        <button class="btn btn-primary" onclick="showModal('createUserModal')">+ Add User</button>
      </div>
      <table>
        <thead><tr><th>Username</th><th>Credits</th><th>Permissions</th><th>Sessions</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="usersTable"><tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-muted);">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
  
  <div class="modal-overlay" id="createUserModal">
    <div class="modal">
      <h3>Create New User</h3>
      <form id="createUserForm">
        <div class="form-group"><label>Username</label><input type="text" name="username" required placeholder="john_doe"></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="6" placeholder="••••••••"></div>
        <div class="form-group"><label>Initial Credits</label><input type="number" name="credits" value="10" min="0"></div>
        <div class="form-group">
          <label>Permissions</label>
          <div class="checkbox-group">
            <label><input type="checkbox" name="canExpand" checked> Expand Answers</label>
            <label><input type="checkbox" name="canAnalyze" checked> Screen Analysis</label>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('createUserModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>
  
  <div class="modal-overlay" id="creditsModal">
    <div class="modal">
      <h3>Manage User Credits</h3>
      <form id="creditsForm">
        <input type="hidden" name="userId" id="creditsUserId">
        <div class="form-group"><label>User: <span id="creditsUserName"></span> (Balance: <span id="creditsUserBalance"></span>)</label></div>
        <div class="form-group">
          <label>Action</label>
          <select name="action">
            <option value="assign">Assign Credits</option>
            <option value="reclaim">Reclaim Credits</option>
          </select>
        </div>
        <div class="form-group"><label>Amount</label><input type="number" name="amount" required min="1" placeholder="10"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('creditsModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Update</button>
        </div>
      </form>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>

  <script>
    async function api(endpoint, options = {}) {
      const res = await fetch(`/api/admin${endpoint}`, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...options.headers }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'API Error');
      return data;
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function showModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    
    function showCreditsModal(userId, username, credits) {
      document.getElementById('creditsUserId').value = userId;
      document.getElementById('creditsUserName').textContent = username;
      document.getElementById('creditsUserBalance').textContent = credits;
      showModal('creditsModal');
    }

    async function loadStats() {
      try {
        const { stats } = await api('/stats');
        document.getElementById('myCredits').textContent = stats.credits.toLocaleString();
        document.getElementById('statUsers').textContent = stats.totalUsers;
        document.getElementById('statActive').textContent = stats.activeUsers;
        document.getElementById('statSessions').textContent = stats.sessionsToday;
        document.getElementById('statCreditsUsed').textContent = stats.creditsUsedToday;
      } catch (e) { console.error(e); }
    }

    async function loadUsers() {
      try {
        const { users } = await api('/users');
        const tbody = document.getElementById('usersTable');
        if (!users.length) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-muted);">No users yet</td></tr>';
          return;
        }
        tbody.innerHTML = users.map(u => {
          const p = u.permissions || {};
          return `
          <tr>
            <td><strong>${u.username}</strong></td>
            <td>${u.credits}</td>
            <td>
              <div class="perm-icons">
                <span class="perm-icon ${p.canExpand ? 'on' : 'off'}" title="Expand">E</span>
                <span class="perm-icon ${p.canAnalyze ? 'on' : 'off'}" title="Analyze">A</span>
              </div>
            </td>
            <td>${u.sessionCount || 0}</td>
            <td><span class="badge badge-${u.status || 'active'}">${u.status || 'active'}</span></td>
            <td>
              <button class="btn btn-secondary" style="padding:6px 10px;font-size:11px;" onclick="showCreditsModal('${u.id}', '${u.username}', ${u.credits})">Credits</button>
              <button class="btn btn-secondary" style="padding:6px 10px;font-size:11px;" onclick="togglePerm('${u.id}', 'canExpand', ${!p.canExpand})">E</button>
              <button class="btn btn-secondary" style="padding:6px 10px;font-size:11px;" onclick="togglePerm('${u.id}', 'canAnalyze', ${!p.canAnalyze})">A</button>
              <button class="btn btn-danger" style="padding:6px 10px;font-size:11px;" onclick="deleteUser('${u.id}', '${u.username}')">×</button>
            </td>
          </tr>
        `}).join('');
      } catch (e) {
        console.error(e);
        document.getElementById('usersTable').innerHTML = '<tr><td colspan="6" style="color:var(--danger);">Failed to load</td></tr>';
      }
    }

    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      try {
        await api('/users', {
          method: 'POST',
          body: JSON.stringify({
            username: form.username.value,
            password: form.password.value,
            credits: parseInt(form.credits.value) || 0,
            permissions: { canExpand: form.canExpand.checked, canAnalyze: form.canAnalyze.checked }
          })
        });
        closeModal('createUserModal');
        form.reset();
        showToast('User created!');
        loadStats();
        loadUsers();
      } catch (e) { showToast(e.message, 'error'); }
    });

    document.getElementById('creditsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      try {
        await api(`/users/${form.userId.value}/credits/${form.action.value}`, {
          method: 'POST',
          body: JSON.stringify({ amount: parseInt(form.amount.value) })
        });
        closeModal('creditsModal');
        showToast('Credits updated!');
        loadStats();
        loadUsers();
      } catch (e) { showToast(e.message, 'error'); }
    });

    async function togglePerm(userId, perm, value) {
      try {
        await api(`/users/${userId}/permissions`, {
          method: 'PATCH',
          body: JSON.stringify({ permissions: { [perm]: value } })
        });
        showToast(`${perm} ${value ? 'enabled' : 'disabled'}`);
        loadUsers();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function deleteUser(id, username) {
      if (!confirm(`Delete "${username}"? Credits will be returned.`)) return;
      try {
        const { creditsReturned } = await api(`/users/${id}`, { method: 'DELETE' });
        showToast(`User deleted. ${creditsReturned} credits returned.`);
        loadStats();
        loadUsers();
      } catch (e) { showToast(e.message, 'error'); }
    }

    function refreshData() { loadStats(); loadUsers(); showToast('Refreshed'); }
    async function logout() { await fetch('/api/logout', { method: 'POST' }); window.location.href = '/login'; }

    loadStats();
    loadUsers();
  </script>
</body>
</html>
