<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Manrope',sans-serif;background:#020308;color:#f8fafc;min-height:100vh}
    body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 0% 0%,rgba(6,182,212,.22),transparent 50%),radial-gradient(ellipse at 90% 10%,rgba(249,115,22,.2),transparent 45%);pointer-events:none}
    .wrap{max-width:1320px;margin:0 auto;padding:40px 24px;position:relative}
    header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,.08)}
    h1{font-family:'Space Grotesk',sans-serif;font-size:28px;background:linear-gradient(135deg,#06b6d4,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .hdr-right{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .credit-chip{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;font-weight:600;color:#f59e0b}
    .btn{border:none;border-radius:14px;padding:12px 20px;font-weight:600;font-size:14px;cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;gap:8px}
    .btn-primary{background:linear-gradient(135deg,#06b6d4,#0284c7);color:#fff;box-shadow:0 10px 30px rgba(2,132,199,.3)}
    .btn-ghost{background:rgba(255,255,255,.05);color:#94a3b8;border:1px solid rgba(255,255,255,.1)}
    .btn:hover{transform:translateY(-2px)}
    .btn-sm{padding:8px 14px;font-size:12px;border-radius:10px}
    .btn-danger{background:rgba(244,63,94,.15);color:#f43f5e;border:1px solid rgba(244,63,94,.3)}
    .btn-danger:hover{background:rgba(244,63,94,.25)}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;margin-bottom:28px}
    .stat{background:rgba(12,14,20,.7);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:20px;backdrop-filter:blur(12px)}
    .stat-label{color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
    .stat-value{font-family:'Space Grotesk',sans-serif;font-size:30px;margin-top:6px}
    .panel{background:rgba(12,14,20,.65);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:24px;backdrop-filter:blur(16px);margin-bottom:24px}
    .panel h2{font-family:'Space Grotesk',sans-serif;font-size:18px;margin-bottom:18px}
    .list{display:flex;flex-direction:column;gap:14px}
    .user-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden;transition:border .2s}
    .user-card:hover{border-color:rgba(255,255,255,.18)}
    .user-header{padding:18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;cursor:pointer}
    .avatar{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#06b6d4,#f97316);display:flex;align-items:center;justify-content:center;font-weight:700}
    .meta{color:#64748b;font-size:13px}
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
    .pill.active{background:rgba(16,185,129,.18);color:#34d399}
    .pill.suspended{background:rgba(244,63,94,.18);color:#f43f5e}
    .expand-icon{transition:transform .3s}
    .user-card.expanded .expand-icon{transform:rotate(180deg)}
    .user-details{max-height:0;overflow:hidden;transition:max-height .4s ease;background:rgba(0,0,0,.2);border-top:1px solid rgba(255,255,255,.05)}
    .user-card.expanded .user-details{max-height:600px}
    .details-content{padding:20px}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
    .mini-stat{text-align:center;padding:16px;background:rgba(255,255,255,.02);border-radius:12px;border:1px solid rgba(255,255,255,.05)}
    .mini-stat-value{font-family:'Space Grotesk',sans-serif;font-size:24px;color:#fff}
    .mini-stat-label{font-size:11px;color:#64748b;text-transform:uppercase;margin-top:4px}
    .perm-row{display:flex;gap:12px;margin-bottom:16px}
    .perm-badge{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600}
    .perm-badge.yes{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.3)}
    .perm-badge.no{background:rgba(244,63,94,.15);color:#f43f5e;border:1px solid rgba(244,63,94,.3)}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    dialog{border:none;background:transparent;padding:0}
    dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
    .modal{width:min(420px,90vw);background:rgba(10,12,18,.97);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:28px}
    .modal h3{font-family:'Space Grotesk',sans-serif;margin-bottom:18px}
    .field{margin-bottom:16px}
    .field label{display:block;margin-bottom:6px;font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.08em}
    .field input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#f8fafc;font-family:inherit}
    .field input:focus{outline:none;border-color:#06b6d4;box-shadow:0 0 0 3px rgba(6,182,212,.2)}
    .chk-row{display:flex;gap:16px;margin-top:8px}
    .chk-row label{display:flex;align-items:center;gap:6px;font-size:14px;color:#94a3b8;cursor:pointer}
    .chk-row input{width:16px;height:16px;accent-color:#06b6d4}
    .modal-actions{display:flex;gap:12px;margin-top:8px}
    .toast{position:fixed;bottom:28px;right:28px;padding:14px 22px;background:rgba(10,12,18,.95);border:1px solid rgba(255,255,255,.1);border-radius:14px;opacity:0;transform:translateY(16px);transition:all .3s}
    .toast.show{opacity:1;transform:translateY(0)}
    .empty{padding:50px 20px;text-align:center;color:#64748b;border:1px dashed rgba(255,255,255,.1);border-radius:18px}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Admin Dashboard</h1><p style="color:#64748b;margin-top:4px">Manage your users</p></div>
    <div class="hdr-right">
      <div class="credit-chip">Credits: <span id="myCred">—</span></div>
      <button class="btn btn-ghost" onclick="location.href='/'">Back to Tool</button>
      <button class="btn btn-primary" onclick="openModal()">+ New User</button>
    </div>
  </header>
  <section class="stats">
    <div class="stat"><div class="stat-label">Total Users</div><div class="stat-value" id="sUsers">—</div></div>
    <div class="stat"><div class="stat-label">Active</div><div class="stat-value" id="sActive">—</div></div>
    <div class="stat"><div class="stat-label">Credits Used Today</div><div class="stat-value" id="sUsed">—</div></div>
    <div class="stat"><div class="stat-label">Sessions Today</div><div class="stat-value" id="sSessions">—</div></div>
  </section>
  <div class="panel">
    <h2>Your Users (click to expand stats)</h2>
    <div id="userList" class="list"><div class="empty">Loading...</div></div>
  </div>
</div>
<dialog id="dlg">
  <div class="modal">
    <h3>Create User</h3>
    <form id="frm">
      <div class="field"><label>Username</label><input id="fUser" required placeholder="candidate"></div>
      <div class="field"><label>Password</label><input id="fPass" type="password" required placeholder="Strong password"></div>
      <div class="field"><label>Credits</label><input id="fCred" type="number" value="15"></div>
      <div class="field">
        <label>Permissions</label>
        <div class="chk-row">
          <label><input type="checkbox" id="pExp" checked> Can Expand</label>
          <label><input type="checkbox" id="pAna" checked> Can Analyze</label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Create</button>
      </div>
    </form>
  </div>
</dialog>
<div class="toast" id="toast"></div>
<script>
const listEl=document.getElementById('userList'),toastEl=document.getElementById('toast');
let usersData=[];

document.getElementById('frm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('fUser').value,password:document.getElementById('fPass').value,credits:+document.getElementById('fCred').value||0,permissions:{canExpand:document.getElementById('pExp').checked,canAnalyze:document.getElementById('pAna').checked}})});if(!r.ok){const d=await r.json();throw new Error(d.error||'Failed')}toast('User created');closeModal();e.target.reset();document.getElementById('pExp').checked=true;document.getElementById('pAna').checked=true;loadAll()}catch(err){toast(err.message||'Failed',1)}};
function openModal(){document.getElementById('dlg').showModal()}
function closeModal(){document.getElementById('dlg').close()}
async function loadAll(){await Promise.all([loadStats(),loadUsers()])}
async function loadStats(){try{const r=await fetch('/api/admin/stats');if(!r.ok)return;const d=await r.json();const s=d.stats||d;document.getElementById('sUsers').textContent=s.totalUsers||0;document.getElementById('sActive').textContent=s.activeUsers||0;document.getElementById('sUsed').textContent=s.creditsUsedToday||0;document.getElementById('sSessions').textContent=s.sessionsToday||0;document.getElementById('myCred').textContent=s.credits||0}catch(_){}}
async function loadUsers(){listEl.innerHTML='<div class="empty">Loading...</div>';try{const r=await fetch('/api/admin/users');if(!r.ok)throw 0;const d=await r.json();usersData=d.users||[];render()}catch(_){listEl.innerHTML='<div class="empty">Failed to load</div>'}}

function render(){
  if(!usersData.length){listEl.innerHTML='<div class="empty">No users yet</div>';return}
  listEl.innerHTML=usersData.map(u=>`
    <div class="user-card" id="user-${u.id}">
      <div class="user-header" onclick="toggleUser('${u.id}')">
        <div class="avatar">${(u.username||'?').slice(0,2).toUpperCase()}</div>
        <div>
          <div style="font-weight:600">${u.username}</div>
          <div class="meta">Credits: ${u.credits||0} · Sessions: ${u.sessionCount||0}</div>
          <span class="pill ${u.status==='active'?'active':'suspended'}">${u.status}</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <svg class="expand-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <div class="user-details">
        <div class="details-content">
          <div class="stats-grid">
            <div class="mini-stat"><div class="mini-stat-value">${u.credits||0}</div><div class="mini-stat-label">Credits</div></div>
            <div class="mini-stat"><div class="mini-stat-value">${u.sessionCount||0}</div><div class="mini-stat-label">Sessions</div></div>
            <div class="mini-stat"><div class="mini-stat-value">${u.creditsUsed||0}</div><div class="mini-stat-label">Used</div></div>
            <div class="mini-stat"><div class="mini-stat-value">${u.lastLogin?new Date(u.lastLogin).toLocaleDateString():'Never'}</div><div class="mini-stat-label">Last Login</div></div>
          </div>
          <div class="perm-row">
            <div class="perm-badge ${u.permissions?.canExpand?'yes':'no'}">Expand: ${u.permissions?.canExpand?'Yes':'No'}</div>
            <div class="perm-badge ${u.permissions?.canAnalyze?'yes':'no'}">Analyze: ${u.permissions?.canAnalyze?'Yes':'No'}</div>
          </div>
          <div class="actions">
            <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();addCred('${u.id}')">Add Credits</button>
            <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();toggleSt('${u.id}','${u.status}')">${u.status==='active'?'Suspend':'Activate'}</button>
            <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();forceOut('${u.id}')">Force Logout</button>
            <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();delUser('${u.id}')">Delete</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function toggleUser(id){
  const card=document.getElementById('user-'+id);
  card.classList.toggle('expanded');
}

async function addCred(id){const a=prompt('Credits to add:');if(!a)return;try{const r=await fetch(`/api/admin/users/${id}/credits/assign`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:+a,description:'Admin credit assignment'})});if(!r.ok)throw 0;toast('Credits added');loadAll()}catch(_){toast('Failed',1)}}
async function toggleSt(id,cur){try{const r=await fetch(`/api/admin/users/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:cur==='active'?'suspended':'active'})});if(!r.ok)throw 0;toast('Status updated');loadAll()}catch(_){toast('Failed',1)}}
async function forceOut(id){if(!confirm('Force logout this user?'))return;try{const r=await fetch(`/api/admin/users/${id}/force-logout`,{method:'POST'});if(!r.ok)throw 0;toast('User logged out')}catch(_){toast('Failed',1)}}
async function delUser(id){if(!confirm('DELETE this user permanently?'))return;try{const r=await fetch(`/api/admin/users/${id}`,{method:'DELETE'});if(!r.ok)throw 0;toast('User deleted');loadAll()}catch(_){toast('Delete failed',1)}}
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/login'}
function toast(m,err){toastEl.textContent=m;toastEl.style.borderColor=err?'rgba(244,63,94,.4)':'rgba(6,182,212,.3)';toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),2500)}
loadAll();
</script>
</body>
</html>
